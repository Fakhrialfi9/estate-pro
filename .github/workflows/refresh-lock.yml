name: Repository maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Format source and tests
        run: npx prettier --write "src/**/*.ts" "src/modules/users/credentials" "test/**/*.ts" --no-error-on-unmatched-pattern
      - name: Commit maintenance changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            exit 0
          fi
          git add package-lock.json src test
          git commit -m 'chore: normalize generated lockfile and formatting'
          git push origin HEAD:main
