name: ESLint Fix Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier formatting to affected files
        run: npx prettier --write test/unit/permissions/roles-phase8-coverage.spec.ts test/unit/property-matching/phase9-coverage.spec.ts test/unit/property/phase10-coverage.spec.ts test/unit/property/property-capabilities-phase10-coverage.spec.ts

      - name: Package formatted files
        run: |
          mkdir -p artifact/test/unit/permissions artifact/test/unit/property-matching artifact/test/unit/property
          cp test/unit/permissions/roles-phase8-coverage.spec.ts artifact/test/unit/permissions/
          cp test/unit/property-matching/phase9-coverage.spec.ts artifact/test/unit/property-matching/
          cp test/unit/property/phase10-coverage.spec.ts artifact/test/unit/property/
          cp test/unit/property/property-capabilities-phase10-coverage.spec.ts artifact/test/unit/property/

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-affected-tests
          path: artifact/
