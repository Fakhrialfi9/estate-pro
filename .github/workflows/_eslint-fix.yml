name: Temporary lint repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'fix(test): resolve remaining lint violations' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply root-cause test fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'test/unit/property-matching/phase9-coverage.spec.ts': [
                  ("    const service = new PropertyMatchingService(\n      repository,\n      new MatchingEngine(),\n      rules as MatchingRuleService,\n      authorization as AuthorizationService,\n      audit,\n    );", "    const audit = {\n      record: vi\n        .fn<SecurityAuditRepository['record']>()\n        .mockResolvedValue(undefined),\n    } satisfies SecurityAuditRepository;\n    const service = new PropertyMatchingService(\n      repository,\n      new MatchingEngine(),\n      rules as MatchingRuleService,\n      authorization as AuthorizationService,\n      audit,\n    );"),
                  ('findPreference: vi.fn()', "findPreference: vi.fn<MatchingRepository['findPreference']>()"),
                  ('createPreference: vi\n        .fn()', "createPreference: vi\n        .fn<MatchingRepository['createPreference']>()"),
                  ('restorePreference: vi\n        .fn()', "restorePreference: vi\n        .fn<MatchingRepository['restorePreference']>()"),
                  ('updatePreference: vi\n        .fn()', "updatePreference: vi\n        .fn<MatchingRepository['updatePreference']>()"),
                  ('archivePreference: vi\n        .fn()', "archivePreference: vi\n        .fn<MatchingRepository['archivePreference']>()"),
                  ('listCandidates: vi.fn()', "listCandidates: vi.fn<MatchingRepository['listCandidates']>()"),
                  ('getSignals: vi.fn()', "getSignals: vi.fn<MatchingRepository['getSignals']>()"),
                  ('saveRecommendation: vi\n        .fn()', "saveRecommendation: vi\n        .fn<MatchingRepository['saveRecommendation']>()"),
                  ('getLatestRecommendation: vi\n        .fn()', "getLatestRecommendation: vi\n        .fn<MatchingRepository['getLatestRecommendation']>()"),
                  ('listRecommendationHistory: vi\n        .fn()', "listRecommendationHistory: vi\n        .fn<MatchingRepository['listRecommendationHistory']>()"),
                  ('recordFeedback: vi.fn()', "recordFeedback: vi.fn<MatchingRepository['recordFeedback']>()"),
                  ('listSavedListings: vi.fn()', "listSavedListings: vi.fn<MatchingRepository['listSavedListings']>()"),
                  ('getPreferenceSubjectScope: vi\n        .fn()', "getPreferenceSubjectScope: vi\n        .fn<MatchingRepository['getPreferenceSubjectScope']>()"),
                  ('active: vi\n        .fn()', "active: vi\n        .fn<MatchingRuleService['active']>()"),
                  ('resolve: vi\n        .fn()', "resolve: vi\n        .fn<AuthorizationService['resolve']>()"),
                  ('assertPermissions: vi.fn()', "assertPermissions: vi.fn<AuthorizationService['assertPermissions']>()"),
              ],
              'test/unit/property/phase10-coverage.spec.ts': [
                  ("Money.from('100', 'IDR').amount", "new Money('100', 'IDR').amount"),
                  ("Money.from('-1', 'IDR')", "new Money('-1', 'IDR')"),
                  ('expect(() => validateCertificateInput({}).toBeUndefined()).not.toThrow();', 'expect(() => validateCertificateInput({})).not.toThrow();'),
                  ('expect(() => validateCertificateDates({}).toBeUndefined()).not.toThrow();', 'expect(() => validateCertificateDates({})).not.toThrow();'),
                  ('expect(() => validateFinancialInvariants({}).toBeUndefined()).not.toThrow();', 'expect(() => validateFinancialInvariants({})).not.toThrow();'),
                  ('expect(() => validateLegalInvariants({}).toBeUndefined()).not.toThrow();', 'expect(() => validateLegalInvariants({})).not.toThrow();'),
                  ('expect(() => validateMedia({}).toBeUndefined()).not.toThrow();', 'expect(() => validateMedia({})).not.toThrow();'),
                  ('expect(() => validateUtilityInvariants({}).toBeUndefined()).not.toThrow();', 'expect(() => validateUtilityInvariants({})).not.toThrow();'),
              ],
              'test/unit/property/property-capabilities-phase10-coverage.spec.ts': [
                  ("    expect(await service.getAmenity(uuid)).toEqual(amenity);\n", ''),
              ],
              'test/unit/roadmap-coverage-core.spec.ts': [
                  ("import { Reflector } from '@nestjs/core';\n", ''),
              ],
              'test/unit/system/critical-integration-lifecycle-coverage.spec.ts': [
                  ("const makeProvider = (): IntegrationProviderPort => ({\n  key: 'crm',\n  version: '1.0',\n  capabilities: ['SYNC'],\n  testConnection: vi.fn().mockResolvedValue({ ok: true }),\n  disconnect: vi.fn().mockResolvedValue(undefined),\n  verifySignature: vi.fn().mockResolvedValue(true),\n  normalizeInbound: vi.fn().mockReturnValue({", "const makeProvider = (): IntegrationProviderPort => {\n  const verifySignature = vi\n    .fn<NonNullable<IntegrationProviderPort['verifySignature']>>()\n    .mockResolvedValue(true);\n  const health = vi\n    .fn<NonNullable<IntegrationProviderPort['health']>>()\n    .mockResolvedValue({ ok: true, latencyMs: 10 });\n  return {\n    key: 'crm',\n    version: '1.0',\n    capabilities: ['SYNC'],\n    testConnection: vi.fn().mockResolvedValue({ ok: true }),\n    disconnect: vi.fn().mockResolvedValue(undefined),\n    verifySignature,\n    normalizeInbound: vi.fn().mockReturnValue({"),
                  ("  }),\n  health: vi.fn().mockResolvedValue({ ok: true, latencyMs: 10 }),\n});", "  }),\n    health,\n  };\n};"),
                  ("async () => 'ok'", "() => Promise.resolve('ok')"),
                  ("async () => 'no'", "() => Promise.resolve('no')"),
              ],
              'test/unit/system/critical-roadmap-coverage.spec.ts': [
                  ("import type { SystemRoadmapRepository } from '../../../src/modules/system/domain/repositories/system-roadmap.repository.js';\n", ''),
                  ("    const notifications = {\n      createNotification: vi.fn().mockResolvedValue(undefined),\n    } as unknown as AutomationNotificationPort;", "    const createNotification = vi\n      .fn<AutomationNotificationPort['createNotification']>()\n      .mockResolvedValue(undefined);\n    const notifications = { createNotification } satisfies AutomationNotificationPort;"),
                  ('expect(notifications.createNotification)', 'expect(createNotification)'),
                  ("    const audit = {\n      record: vi.fn().mockResolvedValue(undefined),\n    } as unknown as SecurityAuditRepository;", "    const record = vi\n      .fn<SecurityAuditRepository['record']>()\n      .mockResolvedValue(undefined);\n    const audit = { record } satisfies SecurityAuditRepository;"),
                  ('expect(audit.record)', 'expect(record)'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              content = path.read_text()
              for before, after in pairs:
                  if before in content:
                      content = content.replace(before, after)
              if filename == 'test/unit/system/critical-roadmap-coverage.spec.ts':
                  pattern = r"    const prisma = \{\n      \$queryRaw: vi[\s\S]*?    \} as unknown as PrismaService;"
                  replacement = """    const queryRaw = vi\n      .fn<PrismaService['$queryRaw']>()\n      .mockResolvedValueOnce([\n        {\n          bucket: '2026-01-01',\n          state: 'SUCCEEDED',\n          count: 2,\n          retries: 1,\n          failures: 0,\n          averageLatencyMs: 10,\n        },\n        {\n          bucket: '2026-01-01',\n          state: null,\n          count: 1n,\n          retries: '2',\n          failures: '1',\n          averageLatencyMs: '20',\n        },\n      ])\n      .mockResolvedValueOnce([])\n      .mockResolvedValueOnce([]);\n    const operationFindMany = vi\n      .fn<PrismaService['systemIntegrationOperation']['findMany']>()\n      .mockResolvedValue([\n        { uuid, state: 'FAILED', attempt: 1, maxAttempts: 3, createdAt: new Date() },\n        { uuid: 'maxed', state: 'FAILED', attempt: 3, maxAttempts: 3, createdAt: new Date() },\n      ]);\n    const operationUpdate = vi\n      .fn<PrismaService['systemIntegrationOperation']['update']>()\n      .mockResolvedValue(undefined);\n    const operationDeleteMany = vi\n      .fn<PrismaService['systemIntegrationOperation']['deleteMany']>()\n      .mockResolvedValue({ count: 1 });\n    const prisma = {\n      $queryRaw: queryRaw,\n      systemIntegrationOperation: {\n        findMany: operationFindMany,\n        update: operationUpdate,\n        deleteMany: operationDeleteMany,\n      },\n    } as unknown as PrismaService;"""
                  if not re.search(pattern, content):
                      raise RuntimeError('Prisma test double block not found')
                  content = re.sub(pattern, replacement, content, count=1)
                  content = content.replace('prisma.$queryRaw', 'queryRaw')
                  content = content.replace('prisma.systemIntegrationOperation.update', 'operationUpdate')
                  content = content.replace('prisma.systemIntegrationOperation.findMany', 'operationFindMany')
              path.write_text(content)
          PY

          npx prettier --write \
            test/unit/property-matching/phase9-coverage.spec.ts \
            test/unit/property/phase10-coverage.spec.ts \
            test/unit/property/property-capabilities-phase10-coverage.spec.ts \
            test/unit/roadmap-coverage-core.spec.ts \
            test/unit/system/critical-integration-lifecycle-coverage.spec.ts \
            test/unit/system/critical-roadmap-coverage.spec.ts

          git diff --exit-code -- .github/workflows/_eslint-fix.yml >/dev/null || true
          if git diff --quiet; then
            echo 'No changes produced by repair script.'
            exit 1
          fi

      - name: Create repaired commit on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add \
            test/unit/property-matching/phase9-coverage.spec.ts \
            test/unit/property/phase10-coverage.spec.ts \
            test/unit/property/property-capabilities-phase10-coverage.spec.ts \
            test/unit/roadmap-coverage-core.spec.ts \
            test/unit/system/critical-integration-lifecycle-coverage.spec.ts \
            test/unit/system/critical-roadmap-coverage.spec.ts
          git commit -m 'fix(test): resolve remaining lint violations'
          tree_sha=$(git rev-parse HEAD^{tree})
          parent_sha=$(git rev-parse HEAD^)
          commit_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message='fix(test): resolve remaining lint violations' \
            -f tree="$tree_sha" \
            -f "parents[]=$parent_sha" \
            --jq '.sha')
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="$commit_sha" \
            -F force=false
