name: ESLint Fix Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ESLint autofixes without changing rules
        run: npx eslint --fix . || true

      - name: Apply Prettier formatting
        run: npx prettier --write "src/**/*.ts" "src/modules/users/credentials" "test/**/*.ts" --no-error-on-unmatched-pattern

      - name: Export working tree
        run: |
          git add -A
          TREE_SHA="$(git write-tree)"
          echo "TREE_SHA=$TREE_SHA"
