name: Type Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: 3306
  DATABASE_NAME: estate_pro_test
  DATABASE_USER: test
  DATABASE_PASSWORD: test-password

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic base fixes
        run: python3 scripts/strict-type-repair.py
      - name: Apply measured final fixes
        run: python3 scripts/final-type-repair-v4.py
      - name: Format repaired source
        run: npx prettier --write src
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Typecheck repaired source
        run: npm run typecheck
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m '[type-fix] repair strict property type contracts'
            git push origin HEAD:main
          fi
