name: Temporary Strict Type Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[ts-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic strict-type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def match_brace(text: str, start: int) -> int:
              depth = 0
              quote = None
              i = start
              while i < len(text):
                  c = text[i]
                  if quote:
                      if c == '\\':
                          i += 2
                          continue
                      if c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in "'\"`":
                      quote = c
                      i += 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError('Unbalanced braces')

          def wrap_objects(path: Path, keys: tuple[str, ...]) -> None:
              text = path.read_text()
              changed = False
              for key in keys:
                  cursor = 0
                  needle = f'{key}: {{'
                  while True:
                      pos = text.find(needle, cursor)
                      if pos < 0:
                          break
                      prefix = text[max(0, pos - 32):pos]
                      if 'omitUndefined(' in prefix:
                          cursor = pos + len(needle)
                          continue
                      brace = pos + len(needle) - 1
                      end = match_brace(text, brace)
                      text = text[:pos] + f'{key}: omitUndefined(' + text[pos + len(key) + 2:]
                      end += len('omitUndefined(')
                      text = text[:end + 1] + ')' + text[end + 1:]
                      cursor = end + 2
                      changed = True
              if changed:
                  if "from '../../../../common/omit-undefined.js'" not in text and "from '../../../common/omit-undefined.js'" not in text:
                      if 'src/modules/property/listing/infrastructure' in str(path):
                          imp = "import { omitUndefined } from '../../../common/omit-undefined.js';\n"
                      else:
                          imp = "import { omitUndefined } from '../../../../common/omit-undefined.js';\n"
                      text = imp + text
                  path.write_text(text)

          helper = Path('src/common/omit-undefined.ts')
          helper.parent.mkdir(parents=True, exist_ok=True)
          if not helper.exists():
              helper.write_text('''type DeepDefined<T> = T extends Date
  ? T
  : T extends readonly (infer U)[]
    ? readonly DeepDefined<U>[]
    : T extends object
      ? { [K in keyof T]-?: DeepDefined<Exclude<T[K], undefined>> }
      : Exclude<T, undefined>;

const clean = (value: unknown): unknown => {
  if (Array.isArray(value)) return value.map(clean);
  if (value instanceof Date) return value;
  if (value && typeof value === 'object') {
    const input = value as Record<string, unknown>;
    const output: Record<string, unknown> = {};
    for (const key of Object.keys(input)) {
      const item = input[key];
      if (item !== undefined) output[key] = clean(item);
    }
    return output;
  }
  return value;
};

export const omitUndefined = <T extends object>(input: T): DeepDefined<T> =>
  clean(input) as DeepDefined<T>;
''')

          # Guard route identifiers before creating Prisma filters.
          p = Path('src/common/security/property-access.guard.ts')
          t = p.read_text()
          old = """    const directPropertyUuid = request.params.propertyUuid;\n    const pathUuid = request.params.uuid;\n\n    const accessible = isListingResource\n"""
          new = """    const directPropertyUuid = request.params.propertyUuid;\n    const pathUuid = request.params.uuid;\n\n    if (isListingResource && !pathUuid) throw new ForbiddenException();\n    const propertyUuid = directPropertyUuid ?? pathUuid;\n    if (!propertyUuid) throw new ForbiddenException();\n\n    const accessible = isListingResource\n"""
          if old in t and 'const propertyUuid = directPropertyUuid ?? pathUuid;' not in t:
              t = t.replace(old, new)
              t = t.replace('uuid: directPropertyUuid ?? pathUuid,', 'uuid: propertyUuid,')
              p.write_text(t)

          # Strict audit domain values.
          p = Path('src/modules/property/application/property-details.service.ts')
          t = p.read_text()
          t = t.replace("actorType: 'user'", "actorType: 'AUTHENTICATED'")
          t = t.replace("result: 'success'", "result: 'SUCCESS'")
          old = """      changes:\n        typeof changes === 'object' && changes !== null\n          ? (changes as Record<string, unknown>)\n          : undefined,\n"""
          new = """      changes:\n        typeof changes === 'object' && changes !== null\n          ? Object.entries(changes as Record<string, unknown>).flatMap(\n              ([field, value]) =>\n                typeof value === 'string' ||\n                typeof value === 'boolean' ||\n                (typeof value === 'number' && Number.isFinite(value)) ||\n                value === null\n                  ? [{ field, oldValue: null, newValue: value }]\n                  : [],\n            )\n          : undefined,\n"""
          if old in t:
              t = t.replace(old, new)
          p.write_text(t)

          p = Path('src/modules/property/application/property-master.service.ts')
          t = p.read_text()
          if 'type SecurityAuditChange' not in t:
              marker = "import type { SecurityAuditRepository } from '../../../common/audit/security-audit.port.js';\n"
              t = t.replace(marker, marker + "import type { SecurityAuditChange } from '../../../common/audit/security-audit.port.js';\n")
          p.write_text(t)

          # noUncheckedIndexedAccess-safe numeric parsing.
          p = Path('src/modules/property/domain/property-extras.ts')
          t = p.read_text()
          t = t.replace("const [w, f = ''] = this.amount.split('.');", "const [w = '0', f = ''] = this.amount.split('.');")
          t = t.replace("const [w, f = ''] = v.split('.'),", "const [w = '0', f = ''] = v.split('.'),")
          t = t.replace("const [a, b] = o;", "const [a = 0, b = 0] = o;")
          p.write_text(t)

          p = Path('src/modules/property/listing/domain/listing.types.ts')
          t = p.read_text()
          t = t.replace("const [whole] = normalized.split('.');", "const [whole = '0'] = normalized.split('.');")
          t = t.replace("const [whole, fraction = ''] = value.split('.');", "const [whole = '0', fraction = ''] = value.split('.');")
          p.write_text(t)

          # Property persistence inputs: omit undefined only at Prisma boundaries.
          details = Path('src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts')
          t = details.read_text()
          t = t.replace("              data: common,", "              data: omitUndefined(common),")
          t = t.replace("            data: scalar,", "            data: omitUndefined(scalar),")
          t = t.replace("            data,\n          });", "            data: omitUndefined(data),\n          });")
          t = t.replace("              : current?.yearBuilt,", "              : (current?.yearBuilt ?? null),")
          t = t.replace("              : current?.yearRenovated,", "              : (current?.yearRenovated ?? null),")
          t = t.replace(
              "        const rooms = await tx.propertyRoom.findMany({",
              "        const rooms = await tx.propertyRoom.findMany({",
          )
          # Handle indexed facility payload defensively when the input array is indexed.
          t = t.replace(
              "          const current = existing[i];\n          const input = inputs[i];\n",
              "          const current = existing[i];\n          const input = inputs[i];\n          if (!input) throw new PropertyDetailInvalidStateError('Facility input is missing');\n",
          )
          details.write_text(t)

          extras = Path('src/modules/property/infrastructure/persistence/prisma-property-extras.repository.ts')
          wrap_objects(extras, ('data', 'where'))
          details = Path('src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts')
          wrap_objects(details, ('data', 'where'))
          listing = Path('src/modules/property/listing/infrastructure/listing.repository.ts')
          wrap_objects(listing, ('data', 'where', 'select'))

          # Master repository contract/type corrections.
          p = Path('src/modules/property/infrastructure/persistence/prisma-property-master.store.ts')
          t = p.read_text()
          t = t.replace("import type {\n  MasterQuery,\n  PageResult,\n  PropertyMasterRepository,\n} from '../../domain/repositories/property-master.repository.js';", "import type {\n  MasterQuery,\n  PropertyMasterRepository,\n} from '../../domain/repositories/property-master.repository.js';\nimport type { PageResult } from '../../domain/property-master.types.js';")
          t = t.replace("const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : allowed[0];", "const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');")
          t = t.replace(
              "      return this.prisma.facility.update({ where: { id: current.id }, data });",
              "      const id = current.id;\n      if (typeof id !== 'number' && typeof id !== 'bigint')\n        throw new MasterNotFoundError();\n      return this.prisma.facility.update({ where: { id }, data });",
          )
          t = t.replace("availabilityStatus: text(input.availabilityStatus, 'AVAILABLE'),", "availabilityStatus: text(input.availabilityStatus, 'AVAILABLE') as 'AVAILABLE' | 'UNAVAILABLE',")
          p.write_text(t)

          # Presentation actor context: authenticated routes must have a concrete actor UUID.
          for name in ('property-lifecycle.controller.ts', 'property-master.controller.ts'):
              p = Path('src/modules/property/presentation') / name
              t = p.read_text()
              old = """const actor = (\n  r: AuthenticatedRequest,\n  userAgent?: string,\n  requestId?: string,\n) => ({ actorUuid: r.user?.sub, ipAddress: r.ip, userAgent, requestId });\n"""
              new = """const actor = (\n  r: AuthenticatedRequest,\n  userAgent?: string,\n  requestId?: string,\n) => {\n  const actorUuid = r.user?.sub;\n  if (!actorUuid) throw new ForbiddenException('Authenticated user is required');\n  return {\n    actorUuid,\n    ipAddress: r.ip,\n    ...(userAgent !== undefined ? { userAgent } : {}),\n    ...(requestId !== undefined ? { requestId } : {}),\n  };\n};\n"""
              if old in t:
                  t = t.replace("  BadRequestException,\n", "  BadRequestException,\n  ForbiddenException,\n")
                  t = t.replace(old, new)
              if name == 'property-master.controller.ts':
                  if 'const record = (value: object)' not in t:
                      t = t.replace("const sanitize = (value: unknown): unknown => {", "const record = (value: object): RecordValue =>\n  Object.fromEntries(Object.entries(value));\nconst sanitize = (value: unknown): unknown => {")
                  replacements = {
                      '.updateCategory(uuid, d.version, d, actor(r, ua, rid))': '.updateCategory(uuid, d.version, record(d), actor(r, ua, rid))',
                      '.updateSubcategory(uuid, d.version, d, actor(r, ua, rid))': '.updateSubcategory(uuid, d.version, record(d), actor(r, ua, rid))',
                      '.createLocation(levelOf(level), d, actor(r, ua, rid))': '.createLocation(levelOf(level), record(d), actor(r, ua, rid))',
                      '.updateLocation(levelOf(level), uuid, d.version, d, actor(r, ua, rid))': '.updateLocation(levelOf(level), uuid, d.version, record(d), actor(r, ua, rid))',
                      '.updateFacility(uuid, d.version, d, actor(r, ua, rid))': '.updateFacility(uuid, d.version, record(d), actor(r, ua, rid))',
                      'return this.service.createProperty(d, actor(r, ua, rid))': 'return this.service.createProperty(record(d), actor(r, ua, rid))',
                      '.updateProperty(uuid, d.version, d, actor(r, ua, rid))': '.updateProperty(uuid, d.version, record(d), actor(r, ua, rid))',
                  }
                  for a, b in replacements.items(): t = t.replace(a, b)
              p.write_text(t)

          # DTO creation contracts match the domain/repository requirement.
          p = Path('src/modules/property/presentation/property-master.dto.ts')
          t = p.read_text()
          for _ in range(3):
              t = t.replace("  @IsOptional() @IsString() @MaxLength(100) slug?: string;", "  @IsString() @MaxLength(100) slug!: string;", 1)
          p.write_text(t)

          # Explicit PageResult re-export for the domain repository contract.
          p = Path('src/modules/property/domain/repositories/property-master.repository.ts')
          t = p.read_text()
          line = "export type { PageResult } from '../property-master.types.js';\n"
          if line not in t:
              t = line + t
          p.write_text(t)
          PY

          npx prettier --write src/common/omit-undefined.ts src/common/security/property-access.guard.ts src/modules/property/application src/modules/property/domain/property-extras.ts src/modules/property/domain/listing src/modules/property/infrastructure/persistence src/modules/property/listing src/modules/property/presentation

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify typecheck before commit
        run: npm run typecheck

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m '[ts-repair] fix strict property type contracts'
          git push origin HEAD:main
