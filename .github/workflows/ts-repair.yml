name: Temporary Strict Type Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[ts-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair strict Prisma object inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('src/common/omit-undefined.ts')
          helper.write_text('''type DeepDefined<T> = T extends Date
  ? T
  : T extends readonly (infer U)[]
    ? readonly DeepDefined<U>[]
    : T extends object
      ? { [K in keyof T]-?: DeepDefined<Exclude<T[K], undefined>> }
      : Exclude<T, undefined>;

const clean = (value: unknown): unknown => {
  if (Array.isArray(value)) return value.map(clean);
  if (value instanceof Date) return value;
  if (value && typeof value === 'object') {
    const input = value as Record<string, unknown>;
    const output: Record<string, unknown> = {};
    for (const key of Object.keys(input)) {
      const item = input[key];
      if (item !== undefined) output[key] = clean(item);
    }
    return output;
  }
  return value;
};

export const omitUndefined = <T extends object>(input: T): DeepDefined<T> =>
  clean(input) as DeepDefined<T>;
''')

          def matching_brace(text: str, start: int) -> int:
              depth = 0
              i = start
              quote = None
              while i < len(text):
                  c = text[i]
                  if quote:
                      if c == '\\':
                          i += 2
                          continue
                      if c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in "'\"`":
                      quote = c
                      i += 1
                      continue
                  if c == '/' and i + 1 < len(text) and text[i + 1] == '/':
                      i = text.find(chr(10), i + 2)
                      if i < 0:
                          return len(text) - 1
                      continue
                  if c == '/' and i + 1 < len(text) and text[i + 1] == '*':
                      i = text.find('*/', i + 2)
                      if i < 0:
                          return len(text) - 1
                      i += 2
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          roots = [Path('src/modules/property/infrastructure'), Path('src/modules/property/listing/infrastructure')]
          for root in roots:
              for path in root.rglob('*.ts'):
                  if path.name.endswith('.spec.ts'):
                      continue
                  text = path.read_text()
                  changed = False
                  for key in ('data', 'where', 'select'):
                      pos = 0
                      needle = f'{key}: {{'
                      while True:
                          found = text.find(needle, pos)
                          if found < 0:
                              break
                          brace = found + len(needle) - 1
                          end = matching_brace(text, brace)
                          if end < 0:
                              break
                          if 'omitUndefined(' not in text[max(0, found - 24):brace + 1]:
                              text = text[:found] + f'{key}: omitUndefined(' + text[found + len(key) + 2:]
                              end += len('omitUndefined(')
                              text = text[:end + 1] + ')' + text[end + 1:]
                              changed = True
                              pos = end + 2
                          else:
                              pos = end + 1
                  if changed:
                      text = f"import {{ omitUndefined }} from '../../../../common/omit-undefined.js';" + chr(10) + text
                      path.write_text(text)

          repo = Path('src/modules/property/domain/repositories/property-master.repository.ts')
          txt = repo.read_text()
          if 'export type { PageResult }' not in txt:
              repo.write_text("export type { PageResult } from '../property-master.types.js';" + chr(10) + txt)

          store = Path('src/modules/property/infrastructure/persistence/prisma-property-master.store.ts')
          txt = store.read_text()
          txt = txt.replace("  type PageRequest,\n  type PropertyStatus,", "  type PageRequest,\n  type PageResult,\n  type PropertyStatus,")
          txt = txt.replace("  MasterQuery,\n  PageResult,\n  PropertyMasterRepository,", "  MasterQuery,\n  PropertyMasterRepository,")
          txt = txt.replace("const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : allowed[0];", "const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');")
          store.write_text(txt)
          PY
          npx prettier --write src/common/omit-undefined.ts src/modules/property/infrastructure src/modules/property/listing/infrastructure src/modules/property/domain/repositories/property-master.repository.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/common/omit-undefined.ts src/modules/property/infrastructure src/modules/property/listing/infrastructure src/modules/property/domain/repositories/property-master.repository.ts
          if ! git diff --cached --quiet; then
            git commit -m '[ts-repair] fix strict Prisma input typing'
            git push origin HEAD:main
          fi
