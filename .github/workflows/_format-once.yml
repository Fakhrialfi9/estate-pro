name: One-time repository formatting

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository sources and tests
        run: >-
          npx --no-install prettier --write
          "src/**/*.ts"
          "src/modules/users/credentials"
          "test/**/*.ts"
          --no-error-on-unmatched-pattern

      - name: Collect formatted files
        run: |
          git diff --name-only > /tmp/formatted-files.txt
          git diff --binary > /tmp/repository-format.patch
          tar -czf /tmp/formatted-files.tar.gz -T /tmp/formatted-files.txt

      - name: Upload formatting artifacts
        uses: actions/upload-artifact@v4
        with:
          name: estate-pro-format-patch
          path: |
            /tmp/formatted-files.txt
            /tmp/repository-format.patch
            /tmp/formatted-files.tar.gz
