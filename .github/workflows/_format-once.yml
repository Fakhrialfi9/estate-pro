name: One-time repository formatting

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository sources and tests
        run: >-
          npx --no-install prettier --write
          "src/**/*.ts"
          "src/modules/users/credentials"
          "test/**/*.ts"
          --no-error-on-unmatched-pattern

      - name: Prepare formatting branch
        id: branch
        run: |
          branch="format-baseline-${GITHUB_RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git rm .github/workflows/_format-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: normalize repository formatting"
          git push --set-upstream origin "$branch"

      - name: Open formatting pull request
        if: steps.branch.outputs.branch != ''
        uses: actions/github-script@v7
        env:
          FORMAT_BRANCH: ${{ steps.branch.outputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = process.env.FORMAT_BRANCH;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base: 'main',
            });
            if (existing.data.length > 0) {
              core.info(`Formatting PR already exists: #${existing.data[0].number}`);
              return;
            }
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base: 'main',
              title: 'style: normalize repository formatting',
              body: 'One-time formatting baseline generated by the repository formatter. No functional changes are intended.',
            });
            core.info(`Created formatting PR #${pr.data.number}`);
