name: One-time repository formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.sha == 'af7d3371c8e42d7e6233b7f16451e0cf5e7ff87b'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository sources and tests
        run: >-
          npx --no-install prettier --write
          "src/**/*.ts"
          "src/modules/users/credentials"
          "test/**/*.ts"
          --no-error-on-unmatched-pattern

      - name: Commit formatted baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_format-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: normalize repository formatting"
          git push origin HEAD:main
