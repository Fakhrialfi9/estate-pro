name: Temporary format probe

on:
  push:
    paths:
      - '.github/workflows/_format-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: npx prettier --write src/modules/crm/infrastructure/providers/http-communication-provider.ts src/modules/dashboard/executive-dashboard.controller.ts src/modules/system/infrastructure/integration/generic-http-integration.provider.ts
      - run: git diff -- src/modules/crm/infrastructure/providers/http-communication-provider.ts src/modules/dashboard/executive-dashboard.controller.ts src/modules/system/infrastructure/integration/generic-http-integration.provider.ts
