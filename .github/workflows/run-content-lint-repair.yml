name: Run Content Lint Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: python3 scripts/repair-content-lint.py
      - run: npx prettier --write src/modules/content
      - run: npx prisma validate
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check
      - name: Commit repair and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add src scripts/repair-content-lint.py
          git rm .github/workflows/run-content-lint-repair.yml
          git diff --cached --check
          git commit -m 'fix(cms): resolve content lint and type errors'
          git push origin HEAD:main
