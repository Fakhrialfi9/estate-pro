name: Prettier Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Format repository TypeScript
        run: npx prettier --write "src/**/*.ts" "src/modules/users/credentials" "test/**/*.ts" --no-error-on-unmatched-pattern

      - name: Upload formatted tree
        uses: actions/upload-artifact@v4
        with:
          name: prettier-main-format
          path: |
            src
            test
          include-hidden-files: true
          retention-days: 1
