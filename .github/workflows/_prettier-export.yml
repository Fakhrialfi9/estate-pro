name: Prettier Export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Format repository TypeScript
        run: npx prettier --write "src/**/*.ts" "src/modules/users/credentials" "test/**/*.ts" --no-error-on-unmatched-pattern

      - name: Upload formatted Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_TREE: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'test/unit/content/content.service-coverage.spec.ts',
            'test/unit/content/content.use-cases-coverage.spec.ts',
            'test/unit/crm/phase7-coverage.spec.ts',
            'test/unit/permissions/roles-phase8-coverage.spec.ts',
            'test/unit/property-matching/phase9-coverage.spec.ts',
            'test/unit/property/phase10-coverage.spec.ts',
            'test/unit/property/property-capabilities-phase10-coverage.spec.ts',
            'test/unit/roadmap-agent-management-coverage.spec.ts',
            'test/unit/roadmap-automation-notification-coverage.spec.ts',
            'test/unit/roadmap-complete-coverage.spec.ts',
            'test/unit/roadmap-coverage-core.spec.ts',
            'test/unit/roadmap-final-gap-coverage.spec.ts',
            'test/unit/roadmap-permissions-coverage.spec.ts',
            'test/unit/roadmap-phase6-10-domain-coverage.spec.ts',
            'test/unit/roadmap-property-extras-coverage.spec.ts',
            'test/unit/sales-seo-roadmap-coverage.spec.ts',
            'test/unit/seo/property-structured-data.spec.ts',
            'test/unit/system/critical-integration-lifecycle-coverage.spec.ts',
            'test/unit/system/critical-roadmap-coverage.spec.ts',
            'test/unit/system/system-observability.service.coverage.spec.ts',
            'test/unit/users/roadmap-credentials-profile-coverage.spec.ts',
            'test/unit/users/user-management-profile-branch-coverage.spec.ts',
          ];
          const entries = paths.map((path) => ({
            path,
            mode: '100644',
            type: 'blob',
            content: fs.readFileSync(path, 'utf8'),
          }));
          entries.push({
            path: '.github/workflows/_prettier-export.yml',
            mode: '100644',
            type: 'blob',
            sha: null,
          });
          fs.writeFileSync(
            '/tmp/formatted-tree.json',
            JSON.stringify({
              base_tree: process.env.BASE_TREE,
              tree: entries,
            }),
          );
          NODE
          gh api --method POST "repos/$REPOSITORY/git/trees" --input /tmp/formatted-tree.json --jq '.sha'
