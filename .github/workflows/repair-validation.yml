name: Repair and Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_POOL_CONNECTION_LIMIT: 2
  DATABASE_CONNECT_TIMEOUT_MS: 5000
  DATABASE_ACQUIRE_TIMEOUT_MS: 10000
  DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
  SECURITY_CORS_ORIGINS: http://localhost:3000

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --global npm@11.18.0

      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_test; CREATE DATABASE estate_pro_test;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"

      - name: Install dependencies
        run: npm ci

      - name: Apply root-cause fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f'{path}: expected exactly 1 match, found {count}'
              p.write_text(text.replace(old, new, 1))

          # Matching repository typing.
          replace_once(
              'src/modules/property-matching/infrastructure/prisma-property-matching.repository.ts',
              "const decimalNumber = (value: Prisma.Decimal | null): number | null =>\n  value == null ? null : Number(value);",
              "const decimalNumber = (value: Prisma.Decimal | null): number | undefined =>\n  value == null ? undefined : Number(value);",
          )
          replace_once(
              'src/modules/property-matching/infrastructure/prisma-property-matching.repository.ts',
              "          subjectType: row.subjectType,",
              "          subjectType: row.subjectType as MatchingSubjectType,",
          )

          # Sales service: remove genuinely unused imports, preserve transition logic in repository,
          # pass the actor required by the repository contract, and avoid coercing arbitrary objects.
          p = Path('src/modules/sales/application/sales.service.ts')
          text = p.read_text()
          text = text.replace('  offerTransitionAllowed,\n', '')
          text = text.replace('  viewingTransitionAllowed,\n', '')
          old = '''    const result = await this.repository.assignOpportunity(\n      uuid,\n      input.ownerUserUuid ?? null,\n      input.teamUuid ?? null,\n    );'''
          new = '''    const result = await this.repository.assignOpportunity(\n      uuid,\n      input.ownerUserUuid ?? null,\n      input.teamUuid ?? null,\n      actor,\n    );'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    if (query.opportunityUuid)\n      await this.getOpportunity(String(query.opportunityUuid), actor);'''
          new = '''    if (typeof query.opportunityUuid === 'string')\n      await this.getOpportunity(query.opportunityUuid, actor);'''
          assert text.count(old) == 2
          text = text.replace(old, new)
          old = '''      propertyUuid?: string;\n      description: string;'''
          new = '''      propertyUuid?: string | null;\n      description: string;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Sales domain money parsing: destructured tuple element must be total under strict indexing.
          replace_once(
              'src/modules/sales/domain/sales.types.ts',
              "  const [whole, fractional = ''] = value.split('.');",
              "  const [whole = '0', fractional = ''] = value.split('.');",
          )
          p = Path('src/modules/sales/domain/sales.types.ts')
          text = p.read_text()
          for name in ('OPPORTUNITY_TRANSITIONS', 'VIEWING_TRANSITIONS', 'NEGOTIATION_TRANSITIONS', 'OFFER_TRANSITIONS', 'DEAL_TRANSITIONS'):
              text = text.replace(f"const {name}: Record<string, readonly string[]> =", f"const {name}: Record<string, readonly string[]> =")
          text = re.sub(
              r"const (VIEWING|NEGOTIATION|OFFER|DEAL)_TRANSITIONS: Record<string, readonly string\[]> = (\{[\s\S]*?\n\});",
              lambda m: m.group(0),
              text,
          )
          # Replace `satisfies Record...` tables with explicit Record annotations so Array.includes accepts string.
          text = text.replace("    })\n      satisfies Record<string, readonly string[]>\n  )[from]?", "    })[from]?")
          text = text.replace("    })\n  )[from]?.includes(to) ?? false;", "    })[from]?.includes(to) ?? false;")
          p.write_text(text)

          # Repository contract: represent records by the public UUID only, align optional actor parameter,
          # and model reopenDeal's terminal-only behavior as never.
          p = Path('src/modules/sales/domain/repositories/sales.repository.ts')
          text = p.read_text()
          old = '''export interface SalesRecord {\n  readonly uuid: string;\n  readonly [key: string]: unknown;\n}'''
          new = '''export interface SalesRecord {\n  readonly uuid: string;\n}'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    scheduledAt: Date | null,\n    actor: SalesActor,\n  ): Promise<SalesRecord>;'''
          new = '''    scheduledAt: Date | null,\n    actor?: SalesActor,\n  ): Promise<SalesRecord | null>;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''  reopenDeal(uuid: string, actor: SalesActor): Promise<SalesRecord | null>;'''
          new = '''  reopenDeal(uuid: string, actor: SalesActor): never;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Prisma schema: the repository already validates the lost-reason UUID; persist it on Sales records.
          p = Path('prisma/schema/sales/sales.prisma')
          text = p.read_text()
          text = text.replace(
              '  propertyUuid   String?                        @db.Char(36)\n  title',
              '  propertyUuid   String?                        @db.Char(36)\n  lostReasonUuid  String?                        @db.Char(36)\n  title',
              1,
          )
          text = text.replace(
              '  ownerUserUuid   String?          @db.Char(36)\n  currency',
              '  ownerUserUuid   String?          @db.Char(36)\n  lostReasonUuid  String?          @db.Char(36)\n  currency',
              1,
          )
          text = text.replace(
              '  @@index([propertyUuid, status])\n  @@index([createdAt])',
              '  @@index([propertyUuid, status])\n  @@index([lostReasonUuid])\n  @@index([createdAt])',
              1,
          )
          text = text.replace(
              '  @@index([ownerUserUuid, status, createdAt])\n  @@index([offerUuid])',
              '  @@index([ownerUserUuid, status, createdAt])\n  @@index([lostReasonUuid])\n  @@index([offerUuid])',
              1,
          )
          p.write_text(text)

          # Repository money parsing.
          replace_once(
              'src/modules/sales/infrastructure/persistence/prisma-sales.repository.ts',
              "  const [whole, fractional = ''] = value.split('.');",
              "  const [whole = '0', fractional = ''] = value.split('.');",
          )

      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma migration deploy
        run: npm run prisma:deploy
      - name: Prisma status
        run: npm run prisma:status
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: E2E tests
        run: npm run test:e2e
      - name: Security baseline
        run: npm run test:security:baseline
      - name: Security tests
        run: npm run test:security
      - name: OpenAPI tests
        run: npm run test:openapi
      - name: Full tests
        run: npm run test:all

      - name: Commit repaired repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git diff --check
          git add src prisma/schema .github/workflows/repair-validation.yml
          git commit -m "fix: resolve sales and matching validation errors [repair-bot]"
          git push origin main
