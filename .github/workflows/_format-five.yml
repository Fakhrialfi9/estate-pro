name: Targeted Prettier Export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Format targeted files
        run: npx prettier --write test/unit/permissions/roles-phase8-coverage.spec.ts test/unit/property/phase10-coverage.spec.ts test/unit/property/property-capabilities-phase10-coverage.spec.ts test/unit/roadmap-complete-coverage.spec.ts test/unit/system/critical-integration-lifecycle-coverage.spec.ts

      - name: Upload formatted tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_TREE: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'test/unit/permissions/roles-phase8-coverage.spec.ts',
            'test/unit/property/phase10-coverage.spec.ts',
            'test/unit/property/property-capabilities-phase10-coverage.spec.ts',
            'test/unit/roadmap-complete-coverage.spec.ts',
            'test/unit/system/critical-integration-lifecycle-coverage.spec.ts',
          ];
          const entries = paths.map((path) => ({
            path,
            mode: '100644',
            type: 'blob',
            content: fs.readFileSync(path, 'utf8'),
          }));
          entries.push({
            path: '.github/workflows/_format-five.yml',
            mode: '100644',
            type: 'blob',
            sha: null,
          });
          fs.writeFileSync(
            '/tmp/tree.json',
            JSON.stringify({ base_tree: process.env.BASE_TREE, tree: entries }),
          );
          NODE
          gh api --method POST "repos/$REPOSITORY/git/trees" --input /tmp/tree.json --jq '.sha'
