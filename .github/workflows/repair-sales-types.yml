name: Targeted Sales Type Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  SECURITY_CORS_ORIGINS: http://localhost:3000

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[sales-type-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_test; CREATE DATABASE estate_pro_test;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"

      - name: Install dependencies
        run: npm ci

      - name: Apply targeted root-cause fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/modules/sales/infrastructure/persistence/prisma-sales.repository.ts')
          text = path.read_text()

          old_import = """  SalesOpportunityRow,\n  SalesRecord,\n  SalesRepository,\n  StageInput,\n  ViewingInput,\n"""
          new_import = """  SalesOpportunityRow,\n  SalesDealRecord,\n  SalesNegotiationRecord,\n  SalesRecord,\n  SalesRepository,\n  StageInput,\n  ViewingInput,\n"""
          assert text.count(old_import) == 1, 'sales repository import block mismatch'
          text = text.replace(old_import, new_import, 1)

          old_negotiation = """  async getNegotiation(uuid: string) {\n    return this.prisma.salesNegotiation.findUnique({ where: { uuid } });\n  }\n"""
          new_negotiation = """  async getNegotiation(\n    uuid: string,\n  ): Promise<SalesNegotiationRecord | null> {\n    const record = await this.prisma.salesNegotiation.findUnique({\n      where: { uuid },\n    });\n    return record\n      ? { ...record, status: record.status as NegotiationStatus }\n      : null;\n  }\n"""
          assert text.count(old_negotiation) == 1, 'getNegotiation block mismatch'
          text = text.replace(old_negotiation, new_negotiation, 1)

          old_deal = """  async getDeal(uuid: string) {\n    return this.prisma.salesDeal.findUnique({\n      where: { uuid },\n      include: { items: true, closing: true, commission: true },\n    });\n  }\n"""
          new_deal = """  async getDeal(uuid: string): Promise<SalesDealRecord | null> {\n    const record = await this.prisma.salesDeal.findUnique({\n      where: { uuid },\n      include: { items: true, closing: true, commission: true },\n    });\n    return record\n      ? { ...record, status: record.status as DealStatus }\n      : null;\n  }\n"""
          assert text.count(old_deal) == 1, 'getDeal block mismatch'
          text = text.replace(old_deal, new_deal, 1)

          path.write_text(text)

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Commit repaired source and remove repair workflow
        run: |
          rm .github/workflows/repair-sales-types.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/sales/infrastructure/persistence/prisma-sales.repository.ts .github/workflows/repair-sales-types.yml
          git commit -m "fix(sales): map prisma status to domain records [sales-type-repair]"
          git push origin main
