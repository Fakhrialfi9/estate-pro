name: Feature branch formatter

on:
  push:
    branches: [phase8-10-hardening]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write src/modules/system/application/services/system-observability.service.ts src/modules/system/application/services/system-retention.service.ts src/modules/system/presentation/retention.controller.ts test/unit/audit/audit-log.service.spec.ts test/unit/automation/automation-notification-delivery.service.spec.ts test/unit/system/system-retention.service.spec.ts
      - run: tar -czf /tmp/estate-pro-formatted.tar.gz src/modules/system/application/services/system-observability.service.ts src/modules/system/application/services/system-retention.service.ts src/modules/system/presentation/retention.controller.ts test/unit/audit/audit-log.service.spec.ts test/unit/automation/automation-notification-delivery.service.spec.ts test/unit/system/system-retention.service.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: feature-format-output
          path: /tmp/estate-pro-formatted.tar.gz
