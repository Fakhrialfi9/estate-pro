name: One-time Prettier normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-once:
    if: github.event.head_commit.message != 'ci: remove one-time formatter after normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npx prettier --write "src/**/*.ts" "src/modules/users/credentials" "test/**/*.ts" --no-error-on-unmatched-pattern
      - name: Commit normalized formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git rm --cached .github/workflows/format-once.yml
          git commit -m "ci: remove one-time formatter after normalization"
          git push origin HEAD:main
