name: One-time CMS Formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npx prettier --write 'src/modules/content/**/*.ts'
      - run: npx prettier --check 'src/modules/content/**/*.ts'
      - name: Commit formatted source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/content
          git rm .github/workflows/format-once.yml
          git diff --cached --check
          git commit -m 'style(cms): normalize content source formatting'
          git push origin HEAD:main
