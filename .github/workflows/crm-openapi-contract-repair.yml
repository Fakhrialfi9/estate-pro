name: CRM OpenAPI Contract Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair CRM success response metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/modules/crm/presentation/crm.controller.ts')
          text = path.read_text()

          marker = "const crmSuccessResponse = (status: 200 | 201) =>"
          if marker not in text:
              helper = """
          const crmSuccessResponse = (status: 200 | 201) =>
            ApiResponse({
              status,
              schema: {
                type: 'object',
                properties: {
                  data: {},
                  meta: {
                    type: 'object',
                    properties: {
                      page: { type: 'integer' },
                      limit: { type: 'integer' },
                      total: { type: 'integer' },
                      totalPages: { type: 'integer' },
                    },
                  },
                },
                required: ['data'],
              },
            });
          """
              text = text.replace("\n@ApiTags('CRM')", "\n" + helper + "\n@ApiTags('CRM')", 1)

          lines = text.splitlines(keepends=True)
          out = []
          i = 0
          route_re = re.compile(r"^(\s*)@(Get|Post|Patch|Delete)\b")
          success_re = re.compile(r"@ApiResponse\(\s*\{\s*status:\s*(200|201)\b")
          schema_re = re.compile(r"@ApiResponse\([\s\S]{0,1200}?status:\s*(200|201)[\s\S]{0,1200}?schema:")

          while i < len(lines):
              m = route_re.match(lines[i])
              if not m:
                  out.append(lines[i])
                  i += 1
                  continue

              method_kind = m.group(2)
              expected = '201' if method_kind == 'Post' else '200'
              j = i + 1
              while j < len(lines) and not route_re.match(lines[j]):
                  j += 1
              block = ''.join(lines[i:j])

              # Existing detailed success response already satisfies the contract.
              has_schema = bool(re.search(rf"@ApiResponse\([\s\S]{{0,1400}}?status:\s*{expected}\b[\s\S]{{0,1400}}?schema:", block))
              # Bare success response gets replaced with the shared schema.
              bare = re.compile(rf"^\s*@ApiResponse\(\s*\{{\s*status:\s*{expected}\s*\}}\)\s*$", re.M)

              if has_schema:
                  out.extend(lines[i:j])
              elif bare.search(block):
                  block = bare.sub(f"  @crmSuccessResponse({expected})", block, count=1)
                  out.append(block)
              else:
                  out.append(f"  @crmSuccessResponse({expected})\n")
                  out.extend(lines[i:j])
              i = j

          path.write_text(''.join(out))
          PY

          npx prettier --write src/modules/crm/presentation/crm.controller.ts

          git diff --check
          git diff -- src/modules/crm/presentation/crm.controller.ts

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/crm/presentation/crm.controller.ts
          git diff --cached --quiet || git commit -m 'fix(crm): complete success response OpenAPI metadata'

      - name: Remove one-time runner
        run: |
          git rm .github/workflows/crm-openapi-contract-repair.yml
          git commit -m 'chore(crm): remove one-time OpenAPI repair runner'
          git push origin main
