name: Test Quality Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Normalize async test doubles
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'test/unit/analytics/analytics-service-coverage.spec.ts',
            'test/unit/automation/automation-service-coverage.spec.ts',
            'test/unit/crm/crm-service-coverage.spec.ts',
            'test/unit/sales/sales-service-coverage.spec.ts',
            'test/unit/system/system-settings-service-boundaries.spec.ts',
          ];
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll('vi.fn(async', 'vi.fn(');
            fs.writeFileSync(file, source);
          }

          const analytics = 'test/unit/analytics/analytics-service-coverage.spec.ts';
          let source = fs.readFileSync(analytics, 'utf8');
          source = source.replace(
            "get: (_target, property) => vi.fn(() => {\n            throw 'failure';\n          }),",
            "get: () => vi.fn(() => {\n            throw new Error('failure');\n          }),",
          );
          source = source.replace("throw 'failure';", "throw new Error('failure');");
          source = source.replace(
            'get: (_target, property) => vi.fn(() => []),',
            'get: () => vi.fn(() => []),',
          );
          fs.writeFileSync(analytics, source);
          NODE

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Commit canonical fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/unit/analytics/analytics-service-coverage.spec.ts \
            test/unit/automation/automation-service-coverage.spec.ts \
            test/unit/crm/crm-service-coverage.spec.ts \
            test/unit/sales/sales-service-coverage.spec.ts \
            test/unit/system/system-settings-service-boundaries.spec.ts
          git commit -m 'test: fix lint and formatting in coverage suites'
          git push origin main
