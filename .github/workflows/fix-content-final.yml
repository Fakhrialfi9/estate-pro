name: Finalize Content Imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const files = [
              'src/modules/content/infrastructure/persistence/prisma-article.repository.ts',
              'src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts',
              'src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts',
              'src/modules/content/presentation/content.controller.ts',
              'src/modules/content/presentation/public-content.controller.ts',
              'src/modules/content/presentation/supporting-content.controller.ts',
            ];
            const exact = {
              'prisma-article.repository.ts': {
                'client.js': "../../../../../prisma/generated/prisma/client.js",
                'prisma.service.js': "../../../../infrastructure/database/prisma/prisma.service.js",
                'content.errors.js': "../../application/content.errors.js",
                'content.types.js': "../../domain/content.types.js",
                'content.repository.js': "../../domain/repositories/content.repository.js",
              },
              'prisma-content-operations.repository.ts': {
                'client.js': "../../../../../prisma/generated/prisma/client.js",
                'prisma.service.js': "../../../../infrastructure/database/prisma/prisma.service.js",
                'content.errors.js': "../../application/content.errors.js",
                'content.types.js': "../../domain/content.types.js",
                'content.repository.js': "../../domain/repositories/content.repository.js",
              },
              'prisma-content-resource.repository.ts': {
                'client.js': "../../../../../prisma/generated/prisma/client.js",
                'prisma.service.js': "../../../../infrastructure/database/prisma/prisma.service.js",
                'content.errors.js': "../../application/content.errors.js",
                'content.types.js': "../../domain/content.types.js",
              },
              'content.controller.ts': {
                'jwt-auth.guard.js': "../../auth/security/jwt-auth.guard.js",
                'authorization.guard.js': "../../../common/security/authorization.guard.js",
                'authorization.decorators.js': "../../../common/security/authorization.decorators.js",
                'content.errors.js': "../application/content.errors.js",
                'content.service.js': "../application/content.service.js",
                'content.use-cases.js': "../application/use-cases/content.use-cases.js",
                'content.dto.js': "./dto/content.dto.js",
                'storage-provider.js': "../../../infrastructure/storage/storage-provider.js",
              },
              'public-content.controller.ts': {
                'authorization.decorators.js': "../../../common/security/authorization.decorators.js",
                'content.service.js': "../application/content.service.js",
                'content.errors.js': "../application/content.errors.js",
              },
              'supporting-content.controller.ts': {
                'jwt-auth.guard.js': "../../auth/security/jwt-auth.guard.js",
                'authorization.guard.js': "../../../common/security/authorization.guard.js",
                'authorization.decorators.js': "../../../common/security/authorization.decorators.js",
                'content.use-cases.js': "../application/use-cases/content.use-cases.js",
                'content.service.js': "../application/content.service.js",
                'content.dto.js': "./dto/content.dto.js",
              },
            };

            for (const path of files) {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              let text = Buffer.from(current.data.content, 'base64').toString('utf8');
              const name = path.split('/').pop();
              for (const [fileSuffix, target] of Object.entries(exact[name] || {})) {
                const escaped = fileSuffix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const re = new RegExp(`from ['"][^'"]+${escaped}['"]`, 'g');
                text = text.replace(re, `from '${target}'`);
              }

              if (name === 'public-content.controller.ts' && !text.includes('\n  Headers,\n')) {
                text = text.replace('  Controller,\n', '  Controller,\n  Headers,\n');
              }
              if (name === 'content.controller.ts') text = text.replace('  Headers,\n', '');
              if (name === 'supporting-content.controller.ts') text = text.replace('  ApiResponse,\n', '');

              if (text !== Buffer.from(current.data.content, 'base64').toString('utf8')) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  message: `fix(cms): normalize ${name} imports`,
                  content: Buffer.from(text).toString('base64'),
                  sha: current.data.sha,
                  branch: 'main',
                });
              }
            }

            const typesPath = 'src/modules/content/domain/content.types.ts';
            const types = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: typesPath, ref: 'main' });
            let typesText = Buffer.from(types.data.content, 'base64').toString('utf8');
            if (!typesText.includes("  'redirect',\n")) typesText = typesText.replace("  'media',\n] as const;", "  'media',\n  'redirect',\n] as const;");
            if (typesText !== Buffer.from(types.data.content, 'base64').toString('utf8')) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner, repo: context.repo.repo, path: typesPath,
                message: 'fix(cms): include redirect in content resource contract',
                content: Buffer.from(typesText).toString('base64'), sha: types.data.sha, branch: 'main'
              });
            }
