name: Temporary Type Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply strict type repairs
        shell: bash
        run: |
          set -euo pipefail

          perl -0pi -e "s/const \[w, f = ''\] = this\.amount\.split\('\.\');/const [w = '0', f = ''] = this.amount.split('.');/" src/modules/property/domain/property-extras.ts
          perl -0pi -e "s/const \[w, f = ''\] = v\.split\('\.'\),/const [w = '0', f = ''] = v.split('.'),/" src/modules/property/domain/property-extras.ts
          perl -0pi -e 's/const \[a, b\] = o;/const [a = 0, b = 0] = o;/' src/modules/property/domain/property-extras.ts
          perl -0pi -e "s/const \[whole, fraction = ''\] = normalized\.split\('\.'\);/const [whole = '0', fraction = ''] = normalized.split('.');/" src/modules/property/listing/domain/listing.types.ts
          perl -0pi -e 's/inputs\[index\]\.available/inputs[index]!.available/g; s/inputs\[index\]\.quantity/inputs[index]!.quantity/g; s/inputs\[index\]\.notes/inputs[index]!.notes/g' src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts

          perl -0pi -e 's/type FacilityCategory,\n  type PageRequest,/type AvailabilityStatus,\n  type FacilityCategory,\n  type PageRequest,/' src/modules/property/infrastructure/persistence/prisma-property-master.store.ts
          perl -0pi -e 's/  MasterQuery,\n  PageResult,\n  PropertyMasterRepository,/  MasterQuery,\n  PropertyMasterRepository,/' src/modules/property/infrastructure/persistence/prisma-property-master.store.ts
          perl -0pi -e "s/const field = q\.sortBy && allowed\.includes\(q\.sortBy\) \? q\.sortBy : allowed\[0\];/const field = q.sortBy \&\& allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');/" src/modules/property/infrastructure/persistence/prisma-property-master.store.ts
          perl -0pi -e "s/      return this\.prisma\.facility\.update\(\{ where: \{ id: current\.id \}, data \}\);/      const id = current.id;\n      if (typeof id !== 'number' \&\& typeof id !== 'bigint')\n        throw new MasterNotFoundError('Facility id is invalid');\n      return this.prisma.facility.update({ where: { id }, data });/" src/modules/property/infrastructure/persistence/prisma-property-master.store.ts
          perl -0pi -e "s/availabilityStatus: text\(input\.availabilityStatus, 'AVAILABLE'\),/availabilityStatus: text(input.availabilityStatus, 'AVAILABLE') as AvailabilityStatus,/" src/modules/property/infrastructure/persistence/prisma-property-master.store.ts

          perl -0pi -e 's/        \}\)\n        \.catch\(\(error: unknown\) => this\.mapError\(error\)\),\n    \);\n  \}\n\n  async expireDue/        }),\n    );\n  }\n\n  async expireDue/' src/modules/property/listing/infrastructure/listing.repository.ts
          perl -0pi -e 's/      slug: string;\n      description\?: string;/      slug?: string;\n      description?: string;/g' src/modules/property/application/property-master.service.ts
          perl -0pi -e 's/      slug: string;\n      category: FacilityCategory;/      slug?: string;\n      category: FacilityCategory;/' src/modules/property/application/property-master.service.ts

          perl -0pi -e 's/createCategory\(d, actor\(r, ua, rid\)\)/createCategory({ ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/updateCategory\(uuid, d\.version, d, actor\(r, ua, rid\)\)/updateCategory(uuid, d.version, { ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/createSubcategory\(d, actor\(r, ua, rid\)\)/createSubcategory({ ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/updateSubcategory\(uuid, d\.version, d, actor\(r, ua, rid\)\)/updateSubcategory(uuid, d.version, { ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/createLocation\(levelOf\(level\), d, actor\(r, ua, rid\)\)/createLocation(levelOf(level), { ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/updateLocation\(levelOf\(level\), uuid, d\.version, d, actor\(r, ua, rid\)\)/updateLocation(levelOf(level), uuid, d.version, { ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/createFacility\(d, actor\(r, ua, rid\)\)/createFacility({ ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/updateFacility\(uuid, d\.version, d, actor\(r, ua, rid\)\)/updateFacility(uuid, d.version, { ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/createProperty\(d, actor\(r, ua, rid\)\)/createProperty({ ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts
          perl -0pi -e 's/updateProperty\(uuid, d\.version, d, actor\(r, ua, rid\)\)/updateProperty(uuid, d.version, { ...d }, actor(r, ua, rid))/g' src/modules/property/presentation/property-master.controller.ts

          while IFS= read -r -d '' file; do
            git rm -f -- "$file"
          done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)

          npm ci
          npm run format:check
          npm run lint
          npm run typecheck

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/temporary-type-repair.yml
          git add -A
          git commit -m 'chore: apply strict type repairs'
          git push origin HEAD:main
