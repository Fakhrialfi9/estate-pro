# one-time repository repair workflow
name: Temporary Type Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: apply strict type repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply strict type repairs and remove Python files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const replaceExact = (file, replacements) => {
            const text = fs.readFileSync(file, 'utf8');
            let next = text;
            for (const [oldText, newText, expected = 1] of replacements) {
              const count = next.split(oldText).length - 1;
              if (count !== expected) {
                throw new Error(`${file}: expected ${expected} occurrences of ${JSON.stringify(oldText)}, found ${count}`);
              }
              next = next.split(oldText).join(newText);
            }
            if (next === text) throw new Error(`${file}: no changes made`);
            fs.writeFileSync(file, next);
          };

          replaceExact('src/modules/property/domain/property-extras.ts', [
            ["const [w, f = ''] = this.amount.split('.')", "const [w = '0', f = ''] = this.amount.split('.')"],
            ["const [w, f = ''] = v.split('.')", "const [w = '0', f = ''] = v.split('.')"],
            ["const [a, b] = o;", "const [a = 0, b = 0] = o;"],
          ]);

          replaceExact('src/modules/property/listing/domain/listing.types.ts', [
            ["const [whole, fraction = ''] = normalized.split('.')", "const [whole = '0', fraction = ''] = normalized.split('.')"],
          ]);

          replaceExact('src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts', [
            [
              """          await tx.propertyFacility.createMany({
            data: ids.map((facilityId, index) => ({
              propertyId,
              facilityId,
              available: inputs[index].available ?? true,
              quantity: inputs[index].quantity ?? null,
              notes: trim(inputs[index].notes) ?? null,
            })),
          });""",
              """          await tx.propertyFacility.createMany({
            data: ids.map((facilityId, index) => {
              const input = inputs[index];
              if (!input)
                throw new PropertyDetailInvalidStateError(
                  'Facility input is missing for the resolved facility id',
                );
              return {
                propertyId,
                facilityId,
                available: input.available ?? true,
                quantity: input.quantity ?? null,
                notes: trim(input.notes) ?? null,
              };
            }),
          });"""
            ],
          ]);

          replaceExact('src/modules/property/infrastructure/persistence/prisma-property-master.store.ts', [
            [
              "  type FacilityCategory,\n  type PageRequest,",
              "  type AvailabilityStatus,\n  type FacilityCategory,\n  type PageRequest,",
            ],
            [
              "  MasterQuery,\n  PageResult,\n  PropertyMasterRepository,",
              "  MasterQuery,\n  PropertyMasterRepository,",
            ],
            [
              "): Row[] => {\n  const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : allowed[0];",
              "): Row[] => {\n  const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');",
            ],
            [
              "      return this.prisma.facility.update({ where: { id: current.id }, data });",
              "      const id = current.id;\n      if (typeof id !== 'number' && typeof id !== 'bigint')\n        throw new MasterNotFoundError('Facility id is invalid');\n      return this.prisma.facility.update({ where: { id }, data });",
            ],
            [
              "            availabilityStatus: text(input.availabilityStatus, 'AVAILABLE'),",
              "            availabilityStatus: text(input.availabilityStatus, 'AVAILABLE') as AvailabilityStatus,",
            ],
          ]);

          replaceExact('src/modules/property/listing/infrastructure/listing.repository.ts', [
            [
              "        })\n        .catch((error: unknown) => this.mapError(error)),\n    );\n  }\n\n  async expireDue",
              "        }),\n    );\n  }\n\n  async expireDue",
            ],
          ]);

          replaceExact('src/modules/property/application/property-master.service.ts', [
            ["      slug: string;\n      description?: string;", "      slug?: string;\n      description?: string;", 2],
            ["      slug: string;\n      category: FacilityCategory;", "      slug?: string;\n      category: FacilityCategory;"],
          ]);

          replaceExact('src/modules/property/presentation/property-master.controller.ts', [
            ["this.service.createCategory(d, actor(r, ua, rid))", "this.service.createCategory({ ...d }, actor(r, ua, rid))"],
            [".updateCategory(uuid, d.version, d, actor(r, ua, rid))", ".updateCategory(uuid, d.version, { ...d }, actor(r, ua, rid))"],
            ["this.service.createSubcategory(d, actor(r, ua, rid))", "this.service.createSubcategory({ ...d }, actor(r, ua, rid))"],
            [".updateSubcategory(uuid, d.version, d, actor(r, ua, rid))", ".updateSubcategory(uuid, d.version, { ...d }, actor(r, ua, rid))"],
            [".createLocation(levelOf(level), d, actor(r, ua, rid))", ".createLocation(levelOf(level), { ...d }, actor(r, ua, rid))"],
            [".updateLocation(levelOf(level), uuid, d.version, d, actor(r, ua, rid))", ".updateLocation(levelOf(level), uuid, d.version, { ...d }, actor(r, ua, rid))"],
            ["this.service.createFacility(d, actor(r, ua, rid))", "this.service.createFacility({ ...d }, actor(r, ua, rid))"],
            [".updateFacility(uuid, d.version, d, actor(r, ua, rid))", ".updateFacility(uuid, d.version, { ...d }, actor(r, ua, rid))"],
            ["this.service.createProperty(d, actor(r, ua, rid))", "this.service.createProperty({ ...d }, actor(r, ua, rid))"],
            [".updateProperty(uuid, d.version, d, actor(r, ua, rid))", ".updateProperty(uuid, d.version, { ...d }, actor(r, ua, rid))"],
          ]);
          NODE

          while IFS= read -r -d '' file; do
            git rm -f -- "$file"
          done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)

          git rm -f .github/workflows/temporary-type-repair.yml

          npm ci
          npm run format:check
          npm run lint
          npm run typecheck

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'chore: apply strict type repairs'
          git push origin HEAD:main
