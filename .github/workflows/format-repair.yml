name: One-time formatting repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-repair:
    if: github.event.head_commit.message != 'chore(ci): remove one-time formatting repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repaired files
        run: npx prettier --write src/modules/system/application/services/system-export.service.ts src/modules/system/infrastructure/export/system-export.scheduler.ts src/modules/system/infrastructure/export/xlsx-export.ts src/modules/system/infrastructure/persistence/prisma-system-webhook.repository.ts src/modules/system/application/services/system-webhook.service.ts test/unit/system/webhook.service.spec.ts

      - name: Commit formatted files and remove workflow
        run: |
          rm -f .github/workflows/format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/system/application/services/system-export.service.ts src/modules/system/infrastructure/export/system-export.scheduler.ts src/modules/system/infrastructure/export/xlsx-export.ts src/modules/system/infrastructure/persistence/prisma-system-webhook.repository.ts src/modules/system/application/services/system-webhook.service.ts test/unit/system/webhook.service.spec.ts .github/workflows/format-repair.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ci): remove one-time formatting repair"
          git push origin main
