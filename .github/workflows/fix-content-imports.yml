name: Repair CMS Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [
              'src/modules/content/infrastructure/persistence/prisma-article.repository.ts',
              'src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts',
              'src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts',
              'src/modules/content/presentation/content.controller.ts',
              'src/modules/content/presentation/public-content.controller.ts',
              'src/modules/content/presentation/supporting-content.controller.ts',
            ];
            const replacements = [
              ['../../../../prisma/generated/prisma/client.js','../../../../../prisma/generated/prisma/client.js'],
              ['../../../infrastructure/database/prisma/prisma.service.js','../../../../infrastructure/database/prisma/prisma.service.js'],
              ['../../common/security/authorization.guard.js','../../../common/security/authorization.guard.js'],
              ['../../common/security/authorization.decorators.js','../../../common/security/authorization.decorators.js'],
              ['../auth/security/jwt-auth.guard.js','../../auth/security/jwt-auth.guard.js'],
              ['./application/content.errors.js','../application/content.errors.js'],
              ['./application/content.service.js','../application/content.service.js'],
              ['./application/use-cases/content.use-cases.js','../application/use-cases/content.use-cases.js'],
              ['./presentation/dto/content.dto.js','./dto/content.dto.js'],
              ['../../infrastructure/storage/storage-provider.js','../../../infrastructure/storage/storage-provider.js'],
              ['../../content/application/content.errors.js','../../application/content.errors.js'],
              ['../../content/domain/content.types.js','../../domain/content.types.js'],
              ['../../content/domain/repositories/content.repository.js','../../domain/repositories/content.repository.js'],
              ['../application/content.errors.js','../../application/content.errors.js'],
              ['../domain/content.types.js','../../domain/content.types.js'],
              ['../domain/repositories/content.repository.js','../../domain/repositories/content.repository.js'],
            ];
            const enumFiles = {
              'src/modules/content/infrastructure/persistence/prisma-article.repository.ts': ['ArticleType','ContentFormat','ContentStatus','ContentVisibility'],
              'src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts': ['ContentFormat','ContentVisibility','ModerationStatus'],
              'src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts': ['BannerPlacement','ContentFormat','ContentStatus','ContentVisibility','RelationType'],
            };
            for (const path of files) {
              const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref:'main'});
              let text = Buffer.from(current.data.content, 'base64').toString('utf8');
              for (const [a,b] of replacements) text = text.split(a).join(b);
              if (enumFiles[path]) {
                const marker = "import { Prisma } from '../../../../../prisma/generated/prisma/client.js';";
                if (!text.includes("from '../../../../../prisma/generated/prisma/enums.js';")) {
                  const block = `import {\n${enumFiles[path].map(x => `  ${x},`).join('\n')}\n} from '../../../../../prisma/generated/prisma/enums.js';`;
                  text = text.replace(marker, `${marker}\n${block}`);
                }
                for (const e of enumFiles[path]) text = text.split(`Prisma.${e}`).join(e);
              }
              text = text.split('String(input.language ?? \'id\')').join("typeof input.language === 'string' ? input.language : 'id'");
              text = text.split('String(input.title)').join("String(input.title)");
              text = text.split('String(input.slug)').join("String(input.slug)");
              text = text.split('String(input.provider ?? \'local\')').join("typeof input.provider === 'string' ? input.provider : 'local'");
              text = text.split("String(snapshot.template ?? current.template)").join("typeof snapshot.template === 'string' ? snapshot.template : current.template");
              text = text.split("String(snapshot.contentFormat ?? 'RICH_TEXT')").join("(typeof snapshot.contentFormat === 'string' ? snapshot.contentFormat : 'RICH_TEXT')");
              text = text.split("String(snapshot.visibility ?? 'PUBLIC')").join("(typeof snapshot.visibility === 'string' ? snapshot.visibility : 'PUBLIC')");
              text = text.split("String(snapshot.language ?? current.language)").join("typeof snapshot.language === 'string' ? snapshot.language : current.language");
              text = text.replace('  Headers,\n', '');
              text = text.replace('  ApiResponse,\n', '');
              text = text.replace("request.ip, request.headers['user-agent']", "request.ip ?? 'unknown', request.headers['user-agent']");
              if (path.endsWith('content.service.ts')) {
                text = text.replace('  PagedResult,\n','');
                text = text.replace('/\\u0000-\\u001f/.test(href)','hasControlCharacters(href)');
                if (!text.includes('const hasControlCharacters')) text = text.replace('const words =', "const hasControlCharacters = (value: string): boolean => [...value].some((c) => c.charCodeAt(0) < 32);\n\nconst words =");
              }
              if (text !== Buffer.from(current.data.content, 'base64').toString('utf8')) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner, repo: context.repo.repo, path,
                  message: `fix(cms): repair type resolution in ${path.split('/').pop()}`,
                  content: Buffer.from(text).toString('base64'), sha: current.data.sha, branch:'main'
                });
              }
            }
