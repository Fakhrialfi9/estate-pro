name: One-off content lint/type repair

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_POOL_CONNECTION_LIMIT: 2
  DATABASE_CONNECT_TIMEOUT_MS: 5000
  DATABASE_ACQUIRE_TIMEOUT_MS: 10000
  DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
  SECURITY_CORS_ORIGINS: http://localhost:3000

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply root-cause lint/type fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, required: bool = True) -> None:
              text = path.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f'expected text not found in {path}: {old!r}')
                  return
              path.write_text(text.replace(old, new, 1))

          service = Path('src/modules/content/application/content.service.ts')
          replace_once(service, '  PagedResult,\n', '')
          replace_once(service, "        /[\\u0000-\\u001f]/.test(href)\n", '        hasControlCharacters(href)\n')
          replace_once(service,
              "const words = (value: unknown): number => {\n",
              "const hasControlCharacters = (value: string): boolean =>\n  [...value].some((character) => character.charCodeAt(0) < 32);\n\nconst words = (value: unknown): number => {\n")
          replace_once(service,
              "provider: String(metadata.provider ?? 'local'),",
              "provider:\n        typeof metadata.provider === 'string' ? metadata.provider : 'local',")

          article = Path('src/modules/content/infrastructure/persistence/prisma-article.repository.ts')
          replace_once(article, '            status: Prisma.ContentStatus.DRAFT,\n', '            status: ContentStatus.DRAFT,\n')
          replace_once(article,
              "            language: String(input.language ?? 'id'),\n",
              "            language:\n              typeof input.language === 'string' ? input.language : 'id',\n")
          replace_once(article,
              '        if (input.title !== undefined) data.title = String(input.title);\n',
              "        if (input.title !== undefined) data.title = this.requiredString(input.title, 'title');\n")
          replace_once(article,
              '        if (input.slug !== undefined) data.slug = String(input.slug);\n',
              "        if (input.slug !== undefined) data.slug = this.requiredString(input.slug, 'slug');\n")
          replace_once(article,
              '        if (input.language !== undefined)\n          data.language = String(input.language);\n',
              "        if (input.language !== undefined)\n          data.language = this.requiredString(input.language, 'language');\n")
          replace_once(article,
              '  private enumStatus(value: unknown): Prisma.ContentStatus {\n',
              "  private requiredString(value: unknown, field: string): string {\n    if (typeof value !== 'string' || !value.trim())\n      throw new ContentValidationError(`${field} is invalid`);\n    return value.trim();\n  }\n\n  private enumStatus(value: unknown): ContentStatus {\n")

          operations = Path('src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts')
          replace_once(operations, "import { createHash } from 'node:crypto';\n", '')
          replace_once(operations,
              "            template: String(snapshot.template ?? current.template),\n",
              "            template:\n              typeof snapshot.template === 'string'\n                ? snapshot.template\n                : current.template,\n")
          replace_once(operations,
              "            contentFormat: String(\n              snapshot.contentFormat ?? 'RICH_TEXT',\n            ) as ContentFormat,\n",
              "            contentFormat:\n              typeof snapshot.contentFormat === 'string'\n                ? (snapshot.contentFormat as ContentFormat)\n                : ContentFormat.RICH_TEXT,\n")
          replace_once(operations,
              "            visibility: String(\n              snapshot.visibility ?? 'PUBLIC',\n            ) as ContentVisibility,\n",
              "            visibility:\n              typeof snapshot.visibility === 'string'\n                ? (snapshot.visibility as ContentVisibility)\n                : ContentVisibility.PUBLIC,\n")
          replace_once(operations,
              "            language: String(snapshot.language ?? current.language),\n",
              "            language:\n              typeof snapshot.language === 'string'\n                ? snapshot.language\n                : current.language,\n")

          resource = Path('src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts')
          text = resource.read_text()
          text = text.replace(
              "function plain(value: unknown): Record<string, unknown> {\n",
              """function requiredString(value: unknown, field: string): string {\n  if (typeof value !== 'string' || !value.trim())\n    throw new ContentValidationError(`${field} is invalid`);\n  return value.trim();\n}\n\nfunction optionalString(value: unknown, fallback: string): string {\n  return typeof value === 'string' ? value : fallback;\n}\n\nfunction plain(value: unknown): Record<string, unknown> {\n""", 1)
          text = text.replace(
              "  ContentConflictError,\n  ContentNotFoundError,\n",
              "  ContentConflictError,\n  ContentNotFoundError,\n  ContentValidationError,\n", 1)
          replacements = {
              "provider: String(input.provider ?? 'local')": "provider: optionalString(input.provider, 'local')",
              "relationType: relationType as RelationType": "relationType: requiredString(relationType, 'relationType') as RelationType",
              "relationType: String(\n          input.relationType ?? 'RELATED',\n        ) as RelationType": "relationType: requiredString(\n          input.relationType ?? 'RELATED',\n          'relationType',\n        ) as RelationType",
              "title: String(input.title)": "title: requiredString(input.title, 'title')",
              "slug: String(input.slug)": "slug: requiredString(input.slug, 'slug')",
              "template: String(input.template ?? 'default')": "template: optionalString(input.template, 'default')",
              "contentFormat: String(\n          input.contentFormat ?? 'RICH_TEXT',\n        ) as ContentFormat": "contentFormat: optionalString(\n          input.contentFormat,\n          'RICH_TEXT',\n        ) as ContentFormat",
              "visibility: String(\n          input.visibility ?? 'PUBLIC',\n        ) as ContentVisibility": "visibility: optionalString(input.visibility, 'PUBLIC') as ContentVisibility",
              "language: String(input.language ?? 'id')": "language: optionalString(input.language, 'id')",
              "placement: String(\n          input.placement ?? 'HOME_HERO',\n        ) as BannerPlacement": "placement: optionalString(input.placement, 'HOME_HERO') as BannerPlacement",
              "startAt: input.startAt ? new Date(String(input.startAt)) : null": "startAt:\n        input.startAt === undefined\n          ? null\n          : new Date(requiredString(input.startAt, 'startAt'))",
              "endAt: input.endAt ? new Date(String(input.endAt)) : null": "endAt:\n        input.endAt === undefined\n          ? null\n          : new Date(requiredString(input.endAt, 'endAt'))",
              "data.status = String(input.status) as ContentStatus": "data.status = requiredString(input.status, 'status') as ContentStatus",
              "data.visibility = String(input.visibility) as ContentVisibility": "data.visibility = requiredString(input.visibility, 'visibility') as ContentVisibility",
              "data.contentFormat = String(input.contentFormat) as ContentFormat": "data.contentFormat = requiredString(input.contentFormat, 'contentFormat') as ContentFormat",
              "data.placement = String(input.placement) as BannerPlacement": "data.placement = requiredString(input.placement, 'placement') as BannerPlacement",
              "data.startAt = input.startAt ? new Date(String(input.startAt)) : null": "data.startAt = new Date(requiredString(input.startAt, 'startAt'))",
              "data.endAt = input.endAt ? new Date(String(input.endAt)) : null": "data.endAt = new Date(requiredString(input.endAt, 'endAt'))",
              "const label = String(item.label ?? '').trim()": "const label = optionalString(item.label, '').trim()",
              "itemType: String(item.itemType ?? 'url')": "itemType: optionalString(item.itemType, 'url')",
              "findFirst(args: Record<string, unknown>): Promise<unknown | null>;": "findFirst(args: Record<string, unknown>): Promise<unknown>;",
              "findUnique?(args: Record<string, unknown>): Promise<unknown | null>;": "findUnique?(args: Record<string, unknown>): Promise<unknown>;",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          resource.write_text(text)

          bridge = Path('src/modules/content/infrastructure/prisma-content.repository.ts')
          text = bridge.read_text().replace('  ArticleRecord,\n', '')
          text = text.replace(
              '  createMediaObject(input: Record<string, unknown>, ctx: AuditContext) {\n    return this.resources.createMedia(input);\n  }',
              '  createMediaObject(input: Record<string, unknown>) {\n    return this.resources.createMedia(input);\n  }')
          text = text.replace(
              "    ctx: AuditContext,\n  ) {\n    return this.operations.toggle(kind, articleUuid, userUuid);\n  }",
              "  ) {\n    return this.operations.toggle(kind, articleUuid, userUuid);\n  }", 1)
          text = text.replace(
              "    ctx: AuditContext,\n  ) {\n    return this.operations.moderate(uuid, status, reason);\n  }",
              "  ) {\n    return this.operations.moderate(uuid, status, reason);\n  }", 1)
          text = text.replace(
              "    ctx: AuditContext,\n  ) {\n    return this.operations.comment(articleUuid, input);\n  }",
              "  ) {\n    return this.operations.comment(articleUuid, input);\n  }", 1)
          text = text.replace(
              '  removeRelation(uuid: string, ctx: AuditContext) {\n    return this.resources.deleteRelation(uuid);\n  }',
              '  removeRelation(uuid: string) {\n    return this.resources.deleteRelation(uuid);\n  }')
          text = text.replace(
              '  reorderMenu(uuid: string, items: string[], ctx: AuditContext) {\n    return this.resources.reorderMenu(uuid, items);\n  }',
              '  reorderMenu(uuid: string, items: string[]) {\n    return this.resources.reorderMenu(uuid, items);\n  }')
          text = text.replace(
              "    ctx: AuditContext,\n  ) {\n    return this.resources.ensureRedirect(type, oldSlug, newSlug);\n  }",
              "  ) {\n    return this.resources.ensureRedirect(type, oldSlug, newSlug);\n  }", 1)
          bridge.write_text(text)

          controller = Path('src/modules/content/presentation/content.controller.ts')
          controller.write_text(controller.read_text().replace('  Headers,\n', ''))
          supporting = Path('src/modules/content/presentation/supporting-content.controller.ts')
          supporting.write_text(supporting.read_text().replace('  ApiResponse,\n', ''))
          PY

          npx prettier --write \
            src/modules/content/application/content.service.ts \
            src/modules/content/infrastructure/persistence/prisma-article.repository.ts \
            src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts \
            src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts \
            src/modules/content/infrastructure/prisma-content.repository.ts \
            src/modules/content/presentation/content.controller.ts \
            src/modules/content/presentation/supporting-content.controller.ts

      - name: Install dependencies
        run: npm ci
      - name: Prisma validation
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Lint validation
        run: npm run lint
      - name: Typecheck validation
        run: npm run typecheck
      - name: Build validation
        run: npm run build
      - name: Format validation
        run: npm run format:check
      - name: Commit verified repair and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm .github/workflows/_oneoff-fix-login-harness.yml
          git diff --cached --check
          git commit -m 'fix(cms): resolve lint and type safety errors'
          git push origin HEAD:main

# Intentionally one-shot: this workflow removes itself after successful validation.