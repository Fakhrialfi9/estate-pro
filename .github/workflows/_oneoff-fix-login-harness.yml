name: One-off login harness fix

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_POOL_CONNECTION_LIMIT: 2
  DATABASE_CONNECT_TIMEOUT_MS: 5000
  DATABASE_ACQUIRE_TIMEOUT_MS: 10000
  DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
  AUTH_LOGIN_RATE_LIMIT: 5
  AUTH_LOGIN_RATE_LIMIT_TTL_MS: 60000

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_test; CREATE DATABASE estate_pro_test;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"

      - name: Patch stale LoginService test harness
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('test/security/security-hardening-272-295.spec.ts')
          text = path.read_text()

          if 'const refreshTokens = {' not in text:
              old = '''  const twoFactor = { isEnabled: vi.fn().mockResolvedValue(false) };\n  const config = {\n'''
              new = '''  const refreshTokens = {\n    getSessionExpiresAt: vi\n      .fn()\n      .mockReturnValue(new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)),\n    issueForSession: vi.fn().mockResolvedValue({\n      accessToken: 'signed.jwt',\n      refreshToken: 'opaque.refresh.token',\n      tokenType: 'Bearer',\n      expiresIn: 60,\n      refreshTokenExpiresIn: 30 * 24 * 60 * 60,\n    }),\n  };\n  const twoFactor = { isEnabled: vi.fn().mockResolvedValue(false) };\n  const config = {\n'''
              if old not in text:
                  raise SystemExit('expected stale harness block not found')
              text = text.replace(old, new, 1)

          if '    refreshTokens as never,\n' not in text:
              old = '''    sessions as never,\n    config as never,\n    twoFactor as never,\n'''
              new = '''    sessions as never,\n    refreshTokens as never,\n    config as never,\n    twoFactor as never,\n'''
              if old not in text:
                  raise SystemExit('expected constructor block not found')
              text = text.replace(old, new, 1)

          if '    refreshTokens,\n    getCreatedSessionId' not in text:
              old = '''    sessions,\n    getCreatedSessionId: () => createdSessionId,\n'''
              new = '''    sessions,\n    refreshTokens,\n    getCreatedSessionId: () => createdSessionId,\n'''
              if old not in text:
                  raise SystemExit('expected return block not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Security test target
        run: npm run test:security -- test/security/security-hardening-272-295.spec.ts

      - name: Full test suite
        run: npm test

      - name: E2E test suite
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Security baseline
        run: npm run test:security:baseline

      - name: Remove one-off workflow and commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/security/security-hardening-272-295.spec.ts
          git rm .github/workflows/_oneoff-fix-login-harness.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(test): align login security harness dependencies'
          git push origin HEAD:main

# Intentionally one-shot: this workflow removes itself after verification.
