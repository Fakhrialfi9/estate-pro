name: One-off content lint/type repair

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_POOL_CONNECTION_LIMIT: 2
  DATABASE_CONNECT_TIMEOUT_MS: 5000
  DATABASE_ACQUIRE_TIMEOUT_MS: 10000
  DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
  SECURITY_CORS_ORIGINS: http://localhost:3000

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply deterministic root-cause repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('src/modules/content/infrastructure/persistence/prisma-article.repository.ts'),
              Path('src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts'),
              Path('src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts'),
              Path('src/modules/content/presentation/content.controller.ts'),
              Path('src/modules/content/presentation/public-content.controller.ts'),
              Path('src/modules/content/presentation/supporting-content.controller.ts'),
          ]

          import_map = {
              '../auth/security/jwt-auth.guard.js': '../../auth/security/jwt-auth.guard.js',
              '../../common/security/authorization.guard.js': '../../../common/security/authorization.guard.js',
              '../../common/security/authorization.decorators.js': '../../../common/security/authorization.decorators.js',
              './application/content.errors.js': '../application/content.errors.js',
              './application/content.service.js': '../application/content.service.js',
              './application/use-cases/content.use-cases.js': '../application/use-cases/content.use-cases.js',
              './presentation/dto/content.dto.js': './dto/content.dto.js',
              '../../infrastructure/storage/storage-provider.js': '../../../infrastructure/storage/storage-provider.js',
              '../../../../prisma/generated/prisma/client.js': '../../../../../prisma/generated/prisma/client.js',
              '../../../infrastructure/database/prisma/prisma.service.js': '../../../../infrastructure/database/prisma/prisma.service.js',
              '../application/content.errors.js': '../../application/content.errors.js',
              '../domain/content.types.js': '../../domain/content.types.js',
              '../domain/repositories/content.repository.js': '../../domain/repositories/content.repository.js',
              '../../content/application/content.errors.js': '../../application/content.errors.js',
              '../../content/domain/content.types.js': '../../domain/content.types.js',
              '../../content/domain/repositories/content.repository.js': '../../domain/repositories/content.repository.js',
          }
          for path in files:
              text = path.read_text()
              for old, new in import_map.items():
                  text = text.replace(old, new)
              path.write_text(text)

          # Prisma 7 generated schema enums are runtime exports from enums.js.
          enum_specs = {
              'src/modules/content/infrastructure/persistence/prisma-article.repository.ts': ['ArticleType', 'ContentFormat', 'ContentStatus', 'ContentVisibility'],
              'src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts': ['ContentFormat', 'ContentVisibility', 'ModerationStatus'],
              'src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts': ['BannerPlacement', 'ContentFormat', 'ContentStatus', 'ContentVisibility', 'RelationType'],
          }
          for filename, names in enum_specs.items():
              path = Path(filename)
              text = path.read_text()
              client_import = "import { Prisma } from '../../../../../prisma/generated/prisma/client.js';"
              if "from '../../../../../prisma/generated/prisma/enums.js';" not in text:
                  enum_import = "import {\n" + ''.join(f"  {name},\n" for name in names) + "} from '../../../../../prisma/generated/prisma/enums.js';"
                  text = text.replace(client_import, client_import + '\n' + enum_import, 1)
              for name in names:
                  text = text.replace(f'Prisma.{name}', name)
              path.write_text(text)

          # ContentResourceType must include redirect because its infrastructure already implements it.
          types = Path('src/modules/content/domain/content.types.ts')
          text = types.read_text()
          if "  'redirect',\n" not in text:
              text = text.replace("  'media',\n] as const;", "  'media',\n  'redirect',\n] as const;", 1)
          types.write_text(text)

          # Response mapper must populate the repository contract's category UUID.
          article = Path('src/modules/content/infrastructure/persistence/prisma-article.repository.ts')
          text = article.read_text()
          if 'categoryUuid: record.category?.uuid ?? null' not in text:
              text = text.replace('      category: record.category,', '      categoryUuid: record.category?.uuid ?? null,\n      category: record.category,', 1)

          # Type-safe unknown -> string helpers for persistence boundaries.
          if 'private requiredString(value: unknown' not in text:
              marker = '  private enumStatus(value: unknown): ContentStatus {'
              helper = """  private requiredString(value: unknown, field: string): string {
    if (typeof value !== 'string' || !value.trim())
      throw new ContentValidationError(`${field} is invalid`);
    return value.trim();
  }

"""
              text = text.replace(marker, helper + marker, 1)
          text = text.replace("String(input.language ?? 'id')", "typeof input.language === 'string' ? input.language : 'id'")
          text = text.replace('String(input.title)', "this.requiredString(input.title, 'title')")
          text = text.replace('String(input.slug)', "this.requiredString(input.slug, 'slug')")
          text = text.replace('String(input.language)', "this.requiredString(input.language, 'language')")
          article.write_text(text)

          # ContentService: remove unused type and replace control-character regex with code-point validation.
          service = Path('src/modules/content/application/content.service.ts')
          text = service.read_text()
          text = text.replace('  PagedResult,\n', '')
          text = re.sub(r'/\\u0000-\\u001f/\.test\(href\)', 'hasControlCharacters(href)', text)
          if 'const hasControlCharacters' not in text:
              marker = 'const words = (value: unknown): number => {'
              helper = "const hasControlCharacters = (value: string): boolean =>\n  [...value].some((character) => character.charCodeAt(0) < 32);\n\n"
              text = text.replace(marker, helper + marker, 1)
          text = text.replace("String(metadata.provider ?? 'local')", "typeof metadata.provider === 'string' ? metadata.provider : 'local'")
          service.write_text(text)

          # Operations repository: no unnecessary stringification of revision snapshots and no unused crypto import.
          ops = Path('src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts')
          text = ops.read_text().replace("import { createHash } from 'node:crypto';\n", '')
          text = text.replace('String(snapshot.template ?? current.template)', "typeof snapshot.template === 'string' ? snapshot.template : current.template")
          text = text.replace("String(snapshot.contentFormat ?? 'RICH_TEXT') as ContentFormat", "(typeof snapshot.contentFormat === 'string' ? snapshot.contentFormat : 'RICH_TEXT') as ContentFormat")
          text = text.replace("String(snapshot.visibility ?? 'PUBLIC') as ContentVisibility", "(typeof snapshot.visibility === 'string' ? snapshot.visibility : 'PUBLIC') as ContentVisibility")
          text = text.replace('String(snapshot.language ?? current.language)', "typeof snapshot.language === 'string' ? snapshot.language : current.language")
          ops.write_text(text)

          # Generic supporting-content repository: avoid unknown coercion and redundant null unions.
          resource = Path('src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts')
          text = resource.read_text()
          text = text.replace(
              "  ContentNotFoundError,\n",
              "  ContentNotFoundError,\n  ContentValidationError,\n",
              1,
          ) if 'ContentValidationError' not in text else text
          if 'function requiredString(value: unknown' not in text:
              marker = 'function plain(value: unknown): Record<string, unknown> {'
              helper = """function requiredString(value: unknown, field: string): string {
  if (typeof value !== 'string' || !value.trim())
    throw new ContentValidationError(`${field} is invalid`);
  return value.trim();
}

function optionalString(value: unknown, fallback: string): string {
  return typeof value === 'string' ? value : fallback;
}

"""
              text = text.replace(marker, helper + marker, 1)
          # Target only explicitly reported coercions plus the known create mappings.
          text = re.sub(r"String\(input\.provider \?\? 'local'\)", "optionalString(input.provider, 'local')", text)
          for field in ['title', 'slug']:
              text = text.replace(f'String(input.{field})', f"requiredString(input.{field}, '{field}')")
          for field in ['template', 'language', 'placement']:
              fallback = {'template': 'default', 'language': 'id', 'placement': 'HOME_HERO'}[field]
              text = re.sub(rf"String\(input\.{field} \?\? '{re.escape(fallback)}'\)", f"optionalString(input.{field}, '{fallback}')", text)
          text = text.replace("String(input.contentFormat ?? 'RICH_TEXT')", "optionalString(input.contentFormat, 'RICH_TEXT')")
          text = text.replace("String(input.visibility ?? 'PUBLIC')", "optionalString(input.visibility, 'PUBLIC')")
          for field in ['status', 'visibility', 'contentFormat', 'placement', 'startAt', 'endAt']:
              text = re.sub(rf'String\(input\.{field}\)', f"requiredString(input.{field}, '{field}')", text)
          text = text.replace("String(item.label ?? '')", "optionalString(item.label, '')")
          text = text.replace("String(item.itemType ?? 'url')", "optionalString(item.itemType, 'url')")
          text = text.replace("String(input.relationType ?? 'RELATED')", "requiredString(input.relationType ?? 'RELATED', 'relationType')")
          text = text.replace('String(relationType) as RelationType', "requiredString(relationType, 'relationType') as RelationType")
          text = text.replace('relationType: relationType as RelationType', "relationType: requiredString(relationType, 'relationType') as RelationType")
          text = text.replace('Promise<unknown | null>;', 'Promise<unknown>;')
          resource.write_text(text)

          # DTO sort whitelist and public request IP.
          dto = Path('src/modules/content/presentation/dto/content.dto.ts')
          text = dto.read_text()
          text = text.replace('@IsOptional() @IsString() @MaxLength(30) sortBy?: string;', """@IsOptional() @IsString() @MaxLength(30) sortBy?:
    | 'createdAt'
    | 'updatedAt'
    | 'publishedAt'
    | 'sortOrder'
    | 'priority'
    | 'title';""", 1)
          dto.write_text(text)

          public_controller = Path('src/modules/content/presentation/public-content.controller.ts')
          text = public_controller.read_text()
          text = text.replace("request.ip, request.headers['user-agent']", "request.ip ?? 'unknown', request.headers['user-agent']")
          public_controller.write_text(text)

          # Existing use-case names require these façade methods.
          service = service_path.read_text()
          if 'transitionArticle(' not in service:
              service = service.replace(
                  "  async archive(uuid: string, ctx: AuditContext) {\n    return this.transition(uuid, 'archive', ctx);\n  }",
                  """  async archive(uuid: string, ctx: AuditContext) {
    return this.transition(uuid, 'archive', ctx);
  }

  async transitionArticle(
    uuid: string,
    action: 'publish' | 'unpublish' | 'archive',
    ctx: AuditContext,
  ) {
    return this.transition(uuid, action, ctx);
  }""", 1)
          if 'interaction(' not in service:
              service = service.replace(
                  """  toggle(
    kind: 'like' | 'bookmark',
    uuid: string,
    user: string,
    ctx: AuditContext,
  ) {
    return this.repository.toggleInteraction(kind, uuid, user, ctx);
  }""",
                  """  toggle(
    kind: 'like' | 'bookmark',
    uuid: string,
    user: string,
    ctx: AuditContext,
  ) {
    return this.repository.toggleInteraction(kind, uuid, user, ctx);
  }

  interaction(
    kind: 'like' | 'bookmark',
    uuid: string,
    user: string,
    ctx: AuditContext,
  ) {
    return this.toggle(kind, uuid, user, ctx);
  }""", 1)
          if 'commentCreate(' not in service:
              service = service.replace(
                  """  comment(uuid: string, input: Record<string, unknown>, ctx: AuditContext) {
    return this.repository.createComment(
      uuid,
      {
        ...input,
        userUuid: ctx.actorUuid,
        content: sanitizeJson(input.content),
      },
      ctx,
    );
  }""",
                  """  comment(uuid: string, input: Record<string, unknown>, ctx: AuditContext) {
    return this.repository.createComment(
      uuid,
      {
        ...input,
        userUuid: ctx.actorUuid,
        content: sanitizeJson(input.content),
      },
      ctx,
    );
  }

  commentCreate(uuid: string, input: Record<string, unknown>, ctx: AuditContext) {
    return this.comment(uuid, input, ctx);
  }""", 1)
          if 'commentModerate(' not in service:
              service = service.replace(
                  """  moderate(
    uuid: string,
    status: string,
    reason: string | undefined,
    ctx: AuditContext,
  ) {
    return this.repository.moderateComment(uuid, status, reason, ctx);
  }""",
                  """  moderate(
    uuid: string,
    status: string,
    reason: string | undefined,
    ctx: AuditContext,
  ) {
    return this.repository.moderateComment(uuid, status, reason, ctx);
  }

  commentModerate(
    uuid: string,
    status: string,
    reason: string | undefined,
    ctx: AuditContext,
  ) {
    return this.moderate(uuid, status, reason, ctx);
  }""", 1)
          service_path.write_text(service)

          # Remove provably unused imports and satisfy bridge methods without changing behavior.
          p = Path('src/modules/content/presentation/content.controller.ts')
          p.write_text(p.read_text().replace('  Headers,\n', ''))
          p = Path('src/modules/content/presentation/supporting-content.controller.ts')
          p.write_text(p.read_text().replace('  ApiResponse,\n', ''))
          p = Path('src/modules/content/infrastructure/prisma-content.repository.ts')
          text = p.read_text().replace('  ArticleRecord,\n', '')
          for old, new in {
              'createMediaObject(input: Record<string, unknown>, ctx: AuditContext)': 'createMediaObject(input: Record<string, unknown>)',
              """toggleInteraction(
    kind: 'like' | 'bookmark',
    articleUuid: string,
    userUuid: string,
    ctx: AuditContext,
  )""": """toggleInteraction(
    kind: 'like' | 'bookmark',
    articleUuid: string,
    userUuid: string,
  )""",
              """moderateComment(
    uuid: string,
    status: string,
    reason: string | undefined,
    ctx: AuditContext,
  )""": """moderateComment(
    uuid: string,
    status: string,
    reason: string | undefined,
  )""",
              """createComment(
    articleUuid: string,
    input: Record<string, unknown>,
    ctx: AuditContext,
  )""": """createComment(
    articleUuid: string,
    input: Record<string, unknown>,
  )""",
              'removeRelation(uuid: string, ctx: AuditContext)': 'removeRelation(uuid: string)',
              'reorderMenu(uuid: string, items: string[], ctx: AuditContext)': 'reorderMenu(uuid: string, items: string[])',
              """ensureSlugRedirect(
    type: string,
    oldSlug: string,
    newSlug: string,
    ctx: AuditContext,
  )""": """ensureSlugRedirect(
    type: string,
    oldSlug: string,
    newSlug: string,
  )""",
          }.items():
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          npx prettier --write \
            src/modules/content/application/content.service.ts \
            src/modules/content/domain/content.types.ts \
            src/modules/content/infrastructure/persistence/prisma-article.repository.ts \
            src/modules/content/infrastructure/persistence/prisma-content-operations.repository.ts \
            src/modules/content/infrastructure/persistence/prisma-content-resource.repository.ts \
            src/modules/content/infrastructure/prisma-content.repository.ts \
            src/modules/content/presentation/content.controller.ts \
            src/modules/content/presentation/public-content.controller.ts \
            src/modules/content/presentation/supporting-content.controller.ts \
            src/modules/content/presentation/dto/content.dto.ts

      - name: Install dependencies
        run: npm ci
      - name: Prisma validation
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Lint validation
        run: npm run lint
      - name: Typecheck validation
        run: npm run typecheck
      - name: Build validation
        run: npm run build
      - name: Format validation
        run: npm run format:check
      - name: Commit verified repair and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm .github/workflows/_oneoff-fix-login-harness.yml
          git diff --cached --check
          git commit -m 'fix(cms): resolve lint and type safety errors'
          git push origin HEAD:main

# Intentionally one-shot: this workflow removes itself after successful validation.