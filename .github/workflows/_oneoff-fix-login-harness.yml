name: One-off refresh lifecycle harness fix

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_POOL_CONNECTION_LIMIT: 2
  DATABASE_CONNECT_TIMEOUT_MS: 5000
  DATABASE_ACQUIRE_TIMEOUT_MS: 10000
  DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
  AUTH_LOGIN_RATE_LIMIT: 5
  AUTH_LOGIN_RATE_LIMIT_TTL_MS: 60000

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_test; CREATE DATABASE estate_pro_test;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"

      - name: Patch refresh lifecycle login test isolation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('test/e2e/refresh-token-lifecycle.e2e.spec.ts')
          text = path.read_text()

          old = """  const response = await http()\n    .post(`${endpoint}/login`)\n    .send({ identifier: user.email, password: PASSWORD })\n    .expect(201);\n"""
          new = """  const response = await http()\n    .post(`${endpoint}/login`)\n    .set('X-Forwarded-For', testClientIp)\n    .send({ identifier: user.email, password: PASSWORD })\n    .expect(201);\n"""
          if old not in text:
              raise SystemExit('expected login helper block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Prisma migration status
        run: npm run prisma:status

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Full test suite
        run: npm run test

      - name: Watch-mode test command in terminating mode
        run: npm run test:watch -- --run

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Security tests
        run: npm run test:security

      - name: Security baseline
        run: npm run test:security:baseline

      - name: Coverage
        run: npm run test:coverage

      - name: E2E coverage
        run: npm run test:coverage:e2e

      - name: All test suites
        run: npm run test:all

      - name: Remove one-off workflow and commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/e2e/refresh-token-lifecycle.e2e.spec.ts
          git rm .github/workflows/_oneoff-fix-login-harness.yml
          git diff --cached --check
          git commit -m 'fix(test): isolate refresh lifecycle login throttle bucket'
          git push origin HEAD:main

# Intentionally one-shot: this workflow removes itself after verification.
