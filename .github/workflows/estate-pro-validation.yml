# Full repository validation for main and pull-request revisions.
name: Estate Pro Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
  DATABASE_POOL_CONNECTION_LIMIT: 2
  DATABASE_CONNECT_TIMEOUT_MS: 5000
  DATABASE_ACQUIRE_TIMEOUT_MS: 10000
  DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
  SECURITY_CORS_ORIGINS: http://localhost:3000

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_test; CREATE DATABASE estate_pro_test;"
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_seed_test; CREATE DATABASE estate_pro_seed_test;"
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_rehearsal; CREATE DATABASE estate_pro_rehearsal;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_seed_test.* TO 'test'@'127.0.0.1';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_rehearsal.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"
      - name: Install dependencies
        run: npm ci
      - name: Prisma schema validation
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Deploy Prisma migrations to fresh database
        run: npm run prisma:deploy
      - name: Migration status
        run: npm run prisma:status
      - name: Validate seed reproducibility on isolated fresh database
        env:
          DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_seed_test
        run: |
          export SEED_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export SEED_DEVELOPMENT_USER_PASSWORD="$(openssl rand -hex 32)"
          npm run prisma:deploy
          npm run prisma:seed
          npm run prisma:seed
      - name: Security baseline
        run: npm run test:security:baseline
      - name: Secret scan
        run: bash scripts/check-secrets.sh
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture validation
        run: npm run check:architecture
      - name: Complete test suite
        run: npm run test
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: E2E tests
        run: npm run test:e2e
      - name: OpenAPI contract tests
        run: npm run test:openapi
      - name: OpenAPI specification validation
        run: npm run openapi:validate
      - name: Security tests
        run: npm run test:security
      - name: Coverage
        run: npm run test:coverage
      - name: E2E coverage
        run: npm run test:coverage:e2e
      - name: Aggregate test suite
        run: npm run test:all
      - name: Production build
        run: npm run build
      - name: Compiled runtime validation
        run: npm run check:runtime
      - name: Fresh installation validation
        run: npm run check:fresh
      - name: Docker image validation
        run: docker build --tag estate-pro:ci .
      - name: Container smoke validation
        run: |
          docker run --rm -d --name estate-pro-ci --network host \
            -e NODE_ENV=test -e APP_HOST=127.0.0.1 -e APP_PORT=3002 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET='test-only-secret-that-is-at-least-32-chars' \
            -e TWO_FACTOR_ENCRYPTION_KEY='test-only-two-factor-encryption-key-at-least-32-chars' \
            -e SWAGGER_ENABLED=false -e OTEL_TRACING_ENABLED=false -e OTEL_METRICS_ENABLED=false \
            estate-pro:ci
          trap 'docker logs estate-pro-ci || true; docker rm -f estate-pro-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/api/v1/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs estate-pro-ci
          exit 1
      - name: Recovery rehearsal
        run: |
          sudo mysqldump --single-transaction --routines --events estate_pro_test > /tmp/estate_pro.sql
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_recovery; CREATE DATABASE estate_pro_recovery;"
          sudo mysql estate_pro_recovery < /tmp/estate_pro.sql
          test "$(sudo mysql -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='estate_pro_recovery';")" -gt 0
      - name: Migration rehearsal
        env:
          DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_rehearsal
        run: |
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_rehearsal; CREATE DATABASE estate_pro_rehearsal;"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_rehearsal.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"
          npm run prisma:deploy
          npm run prisma:status
      - name: Repository cleanliness
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
