name: Estate Pro Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: estate_pro_test
      DATABASE_USER: test
      DATABASE_PASSWORD: test-password
      DATABASE_POOL_CONNECTION_LIMIT: 2
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      DATABASE_ACQUIRE_TIMEOUT_MS: 10000
      DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS estate_pro_test;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"
      - name: Install dependencies
        run: npm ci
      - name: Apply final property type repairs and remove Python scripts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const replace = (file, from, to) => {
            const source = fs.readFileSync(file, 'utf8');
            if (source.includes(from)) fs.writeFileSync(file, source.split(from).join(to));
          };

          replace('src/modules/property/domain/property-extras.ts', "const [w, f = ''] = this.amount.split('.')", "const [w = '0', f = ''] = this.amount.split('.')");
          replace('src/modules/property/domain/property-extras.ts', "const [w, f = ''] = v.split('.')", "const [w = '0', f = ''] = v.split('.')");
          replace('src/modules/property/domain/property-extras.ts', 'const [a, b] = o;', 'const [a, b = 0] = o;');
          replace('src/modules/property/listing/domain/listing.types.ts', "const [whole, fraction = ''] = normalized.split('.')", "const [whole = '0', fraction = ''] = normalized.split('.')");

          replace('src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts', `              available: inputs[index].available ?? true,
              quantity: inputs[index].quantity ?? null,
              notes: trim(inputs[index].notes) ?? null,`, `              available: inputs[index]?.available ?? true,
              quantity: inputs[index]?.quantity ?? null,
              notes: trim(inputs[index]?.notes) ?? null,`);

          const store = 'src/modules/property/infrastructure/persistence/prisma-property-master.store.ts';
          replace(store, `import { PrismaService } from '../../../../infrastructure/database/prisma/prisma.service.js';`, `import { Prisma } from '../../../../prisma/generated/prisma/client.js';
import { PrismaService } from '../../../../infrastructure/database/prisma/prisma.service.js';`);
          replace(store, `import type {
  MasterQuery,
  PageResult,
  PropertyMasterRepository,
} from '../../domain/repositories/property-master.repository.js';`, `import type {
  MasterQuery,
  PropertyMasterRepository,
} from '../../domain/repositories/property-master.repository.js';
import type { PageResult } from '../../domain/property-master.types.js';`);
          replace(store, `const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : allowed[0];`, `const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');`);
          replace(store, `const text = (value: unknown, fallback = ''): string =>
  typeof value === 'string' ? value : fallback;`, `const text = (value: unknown, fallback = ''): string =>
  typeof value === 'string' ? value : fallback;

const availabilityStatus = (value: unknown): Prisma.AvailabilityStatus => {
  const status = text(value, 'AVAILABLE');
  if (status === 'AVAILABLE') return Prisma.AvailabilityStatus.AVAILABLE;
  if (status === 'UNAVAILABLE') return Prisma.AvailabilityStatus.UNAVAILABLE;
  throw new MasterHierarchyError('Invalid availability status');
};`);
          replace(store, `      return this.prisma.facility.update({ where: { id: current.id }, data });`, `      const id = current.id;
      if (typeof id !== 'number' && typeof id !== 'bigint')
        throw new MasterNotFoundError('Facility id is invalid');
      return this.prisma.facility.update({ where: { id }, data });`);
          replace(store, `            availabilityStatus: text(input.availabilityStatus, 'AVAILABLE'),`, `            availabilityStatus: availabilityStatus(input.availabilityStatus),`);
          replace(store, `    slug: string;`, `    slug?: string;`);

          const listing = 'src/modules/property/listing/infrastructure/listing.repository.ts';
          replace(listing, `        })
        .catch((error: unknown) => this.mapError(error)),
    );
  }

  async expireDue`, `        }),
    );
  }

  async expireDue`);

          const controller = 'src/modules/property/presentation/property-master.controller.ts';
          for (const [from, to] of [
            ['this.service.createCategory(d, actor(r, ua, rid))', 'this.service.createCategory({ ...d }, actor(r, ua, rid))'],
            ['.updateCategory(uuid, d.version, d, actor(r, ua, rid))', '.updateCategory(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['this.service.createSubcategory(d, actor(r, ua, rid))', 'this.service.createSubcategory({ ...d }, actor(r, ua, rid))'],
            ['.updateSubcategory(uuid, d.version, d, actor(r, ua, rid))', '.updateSubcategory(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['.createLocation(levelOf(level), d, actor(r, ua, rid))', '.createLocation(levelOf(level), { ...d }, actor(r, ua, rid))'],
            ['.updateLocation(levelOf(level), uuid, d.version, d, actor(r, ua, rid))', '.updateLocation(levelOf(level), uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['this.service.createFacility(d, actor(r, ua, rid))', 'this.service.createFacility({ ...d }, actor(r, ua, rid))'],
            ['.updateFacility(uuid, d.version, d, actor(r, ua, rid))', '.updateFacility(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['this.service.createProperty(d, actor(r, ua, rid))', 'this.service.createProperty({ ...d }, actor(r, ua, rid))'],
            ['.updateProperty(uuid, d.version, d, actor(r, ua, rid))', '.updateProperty(uuid, d.version, { ...d }, actor(r, ua, rid))'],
          ]) replace(controller, from, to);

          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const file = `${dir}/${entry.name}`;
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.py')) fs.rmSync(file);
            }
          };
          walk('.');
          NODE
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Deploy Prisma migrations
        run: npm run prisma:deploy
      - name: Migration status
        run: npm run prisma:status
      - name: Security baseline
        run: npm run test:security:baseline
      - name: Format sources
        run: npx prettier --write src/modules/property/domain/property-extras.ts src/modules/property/domain/repositories/property-master.repository.ts src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts src/modules/property/infrastructure/persistence/prisma-property-master.store.ts src/modules/property/listing/domain/listing.types.ts src/modules/property/listing/infrastructure/listing.repository.ts src/modules/property/application/property-master.service.ts src/modules/property/presentation/property-master.controller.ts
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture validation
        run: npm run check:architecture
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: E2E tests
        run: npm run test:e2e
      - name: Security tests
        run: npm run test:security
      - name: Coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Compiled runtime validation
        run: npm run check:runtime
      - name: Repository cleanliness
        run: |
          test "$(git branch --show-current)" = "main"
          test -z "$(find . -type f -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -print)"
          git diff --check
      - name: Commit repaired source and clean repository
        if: github.event_name == 'push' && github.event.head_commit.message != 'fix: resolve property strict typing errors'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/repair-property-types.yml || true
          git commit -m 'fix: resolve property strict typing errors'
          git push origin HEAD:main
