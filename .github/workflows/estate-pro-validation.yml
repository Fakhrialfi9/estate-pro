name: Estate Pro Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Install locked dependencies for formatting
        run: npm ci --ignore-scripts
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Normalize every tracked TypeScript file
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.ts')
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit synchronized repository state to main
        run: |
          if git diff --quiet -- package-lock.json && git diff --quiet -- src test; then
            echo 'Lockfile and tracked formatting are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src test
          git diff --cached --check
          git commit -m 'chore(ci): synchronize lockfile and tracked formatting'
          git push origin HEAD:main

  validate:
    needs: sync-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
      DATABASE_POOL_CONNECTION_LIMIT: 2
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      DATABASE_ACQUIRE_TIMEOUT_MS: 10000
      DATABASE_POOL_IDLE_TIMEOUT_SEC: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl start mariadb
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_test; CREATE DATABASE estate_pro_test;"
          sudo mysql -e "DROP DATABASE IF EXISTS estate_pro_seed_test; CREATE DATABASE estate_pro_seed_test;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'test'@'127.0.0.1' IDENTIFIED BY 'test-password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_test.* TO 'test'@'127.0.0.1';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON estate_pro_seed_test.* TO 'test'@'127.0.0.1'; FLUSH PRIVILEGES;"
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Deploy Prisma migrations to fresh database
        run: npm run prisma:deploy
      - name: Migration status
        run: npm run prisma:status
      - name: Validate seed reproducibility on isolated fresh database
        env:
          DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_seed_test
        run: |
          export SEED_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export SEED_DEVELOPMENT_USER_PASSWORD="$(openssl rand -hex 32)"
          npm run prisma:deploy
          npm run prisma:seed
          npm run prisma:seed
      - name: Security baseline
        run: npm run test:security:baseline
      - name: Secret scan
        run: bash scripts/check-secrets.sh
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture validation
        run: npm run check:architecture
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: E2E tests
        run: npm run test:e2e
      - name: Security tests
        run: npm run test:security
      - name: Coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Compiled runtime validation
        run: npm run check:runtime
      - name: Docker image validation
        run: docker build --tag estate-pro:ci .
      - name: Repository cleanliness
        run: |
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git diff --check
