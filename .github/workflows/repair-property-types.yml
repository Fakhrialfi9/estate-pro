name: Finalize Property Type Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://test:test-password@127.0.0.1:3306/estate_pro_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply strict source repairs
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const replace = (file, from, to) => {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(from)) return;
            fs.writeFileSync(file, source.split(from).join(to));
          };

          replace('src/modules/property/domain/property-extras.ts', "const [w, f = ''] = this.amount.split('.')", "const [w = '0', f = ''] = this.amount.split('.')");
          replace('src/modules/property/domain/property-extras.ts', "const [w, f = ''] = v.split('.')", "const [w = '0', f = ''] = v.split('.')");
          replace('src/modules/property/domain/property-extras.ts', 'const [a, b] = o;', 'const [a, b = 0] = o;');
          replace('src/modules/property/listing/domain/listing.types.ts', "const [whole, fraction = ''] = normalized.split('.')", "const [whole = '0', fraction = ''] = normalized.split('.')");

          replace(
            'src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts',
            `          await tx.propertyFacility.createMany({
            data: ids.map((facilityId, index) => ({
              propertyId,
              facilityId,
              available: inputs[index].available ?? true,
              quantity: inputs[index].quantity ?? null,
              notes: trim(inputs[index].notes) ?? null,
            })),
          });`,
            `          await tx.propertyFacility.createMany({
            data: ids.map((facilityId, index) => {
              const input = inputs[index];
              if (!input)
                throw new PropertyDetailInvalidStateError(
                  'Facility input is missing for the resolved facility id',
                );
              return {
                propertyId,
                facilityId,
                available: input.available ?? true,
                quantity: input.quantity ?? null,
                notes: trim(input.notes) ?? null,
              };
            }),
          });`,
          );

          const store = 'src/modules/property/infrastructure/persistence/prisma-property-master.store.ts';
          replace(store, `import { PrismaService } from '../../../../infrastructure/database/prisma/prisma.service.js';`, `import { Prisma } from '../../../../prisma/generated/prisma/client.js';
          import { PrismaService } from '../../../../infrastructure/database/prisma/prisma.service.js';`);
          replace(store, `  type ActorContext,\n  type FacilityCategory,\n  type PageRequest,\n  type PropertyStatus,`, `  type ActorContext,\n  type FacilityCategory,\n  type PageRequest,\n  type PropertyStatus,`);
          replace(store, `import type {\n  MasterQuery,\n  PageResult,\n  PropertyMasterRepository,\n} from '../../domain/repositories/property-master.repository.js';`, `import type {\n  MasterQuery,\n  PropertyMasterRepository,\n} from '../../domain/repositories/property-master.repository.js';
          import type { PageResult } from '../../domain/property-master.types.js';`);
          replace(store, `const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : allowed[0];`, `const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');`);
          replace(store, `const text = (value: unknown, fallback = ''): string =>\n  typeof value === 'string' ? value : fallback;`, `const text = (value: unknown, fallback = ''): string =>\n  typeof value === 'string' ? value : fallback;\n\nconst availabilityStatus = (value: unknown): Prisma.AvailabilityStatus => {\n  const status = text(value, 'AVAILABLE');\n  if (status === 'AVAILABLE') return Prisma.AvailabilityStatus.AVAILABLE;\n  if (status === 'UNAVAILABLE') return Prisma.AvailabilityStatus.UNAVAILABLE;\n  throw new MasterHierarchyError('Invalid availability status');\n};`);
          replace(store, `      return this.prisma.facility.update({ where: { id: current.id }, data });`, `      const id = current.id;\n      if (typeof id !== 'number' && typeof id !== 'bigint')\n        throw new MasterNotFoundError('Facility id is invalid');\n      return this.prisma.facility.update({ where: { id }, data });`);
          replace(store, `            availabilityStatus: text(input.availabilityStatus, 'AVAILABLE'),`, `            availabilityStatus: availabilityStatus(input.availabilityStatus),`);
          replace(store, `    slug: string;`, `    slug?: string;`);

          const listing = 'src/modules/property/listing/infrastructure/listing.repository.ts';
          replace(listing, `        })\n        .catch((error: unknown) => this.mapError(error)),\n    );\n  }\n\n  async expireDue`, `        }),\n    );\n  }\n\n  async expireDue`);

          const controller = 'src/modules/property/presentation/property-master.controller.ts';
          for (const [from, to] of [
            ['this.service.createCategory(d, actor(r, ua, rid))', 'this.service.createCategory({ ...d }, actor(r, ua, rid))'],
            ['.updateCategory(uuid, d.version, d, actor(r, ua, rid))', '.updateCategory(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['this.service.createSubcategory(d, actor(r, ua, rid))', 'this.service.createSubcategory({ ...d }, actor(r, ua, rid))'],
            ['.updateSubcategory(uuid, d.version, d, actor(r, ua, rid))', '.updateSubcategory(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['.createLocation(levelOf(level), d, actor(r, ua, rid))', '.createLocation(levelOf(level), { ...d }, actor(r, ua, rid))'],
            ['.updateLocation(levelOf(level), uuid, d.version, d, actor(r, ua, rid))', '.updateLocation(levelOf(level), uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['this.service.createFacility(d, actor(r, ua, rid))', 'this.service.createFacility({ ...d }, actor(r, ua, rid))'],
            ['.updateFacility(uuid, d.version, d, actor(r, ua, rid))', '.updateFacility(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['this.service.createProperty(d, actor(r, ua, rid))', 'this.service.createProperty({ ...d }, actor(r, ua, rid))'],
            ['.updateProperty(uuid, d.version, d, actor(r, ua, rid))', '.updateProperty(uuid, d.version, { ...d }, actor(r, ua, rid))'],
          ]) replace(controller, from, to);

          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const file = `${dir}/${entry.name}`;
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.py')) fs.rmSync(file);
            }
          };
          walk('.');
          NODE
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify Python cleanup
        run: test -z "$(find . -type f -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -print)"
      - name: Commit and remove repair runner
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/repair-property-types.yml
          git commit -m 'fix: resolve property strict typing errors'
          git push origin HEAD:main
