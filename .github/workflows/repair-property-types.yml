name: One-time Property Type Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: resolve property strict typing errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair source and validate
        shell: bash
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/estatepro
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const replaceAll = (file, replacements) => {
            let text = fs.readFileSync(file, 'utf8');
            for (const [from, to] of replacements) text = text.split(from).join(to);
            fs.writeFileSync(file, text);
          };

          replaceAll('src/modules/property/domain/property-extras.ts', [
            ["const [w, f = ''] = this.amount.split('.')", "const [w = '0', f = ''] = this.amount.split('.')"],
            ["const [w, f = ''] = v.split('.')", "const [w = '0', f = ''] = v.split('.')"],
            ['const [a, b] = o;', 'const [a = 0, b = 0] = o;'],
          ]);

          replaceAll('src/modules/property/listing/domain/listing.types.ts', [
            ["const [whole, fraction = ''] = normalized.split('.')", "const [whole = '0', fraction = ''] = normalized.split('.')"],
          ]);

          replaceAll('src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts', [
            [
              `          await tx.propertyFacility.createMany({
            data: ids.map((facilityId, index) => ({
              propertyId,
              facilityId,
              available: inputs[index].available ?? true,
              quantity: inputs[index].quantity ?? null,
              notes: trim(inputs[index].notes) ?? null,
            })),
          });`,
              `          await tx.propertyFacility.createMany({
            data: ids.map((facilityId, index) => {
              const input = inputs[index];
              if (!input)
                throw new PropertyDetailInvalidStateError(
                  'Facility input is missing for the resolved facility id',
                );
              return {
                propertyId,
                facilityId,
                available: input.available ?? true,
                quantity: input.quantity ?? null,
                notes: trim(input.notes) ?? null,
              };
            }),
          });`,
            ],
          ]);

          replaceAll('src/modules/property/domain/repositories/property-master.repository.ts', [
            ['slug: string;', 'slug?: string;'],
          ]);

          replaceAll('src/modules/property/application/property-master.service.ts', [
            ['slug: string;', 'slug?: string;'],
          ]);

          replaceAll('src/modules/property/infrastructure/persistence/prisma-property-master.store.ts', [
            [
              `  type ActorContext,
  type FacilityCategory,
  type PageRequest,
  type PropertyStatus,`,
              `  type ActorContext,
  type AvailabilityStatus,
  type FacilityCategory,
  type PageRequest,
  type PageResult,
  type PropertyStatus,`,
            ],
            [
              `import type {
  MasterQuery,
  PageResult,
  PropertyMasterRepository,
} from '../../domain/repositories/property-master.repository.js';`,
              `import type {
  MasterQuery,
  PropertyMasterRepository,
} from '../../domain/repositories/property-master.repository.js';`,
            ],
            [
              `const text = (value: unknown, fallback = ''): string =>
  typeof value === 'string' ? value : fallback;`,
              `const text = (value: unknown, fallback = ''): string =>
  typeof value === 'string' ? value : fallback;
const availabilityStatus = (value: unknown): AvailabilityStatus => {
  const status = text(value, 'AVAILABLE');
  if (status !== 'AVAILABLE' && status !== 'UNAVAILABLE')
    throw new MasterHierarchyError('Invalid availability status');
  return status;
};`,
            ],
            [
              `const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : allowed[0];`,
              `const field = q.sortBy && allowed.includes(q.sortBy) ? q.sortBy : (allowed[0] ?? 'uuid');`,
            ],
            [
              `      return this.prisma.facility.update({ where: { id: current.id }, data });`,
              `      const id = current.id;
      if (typeof id !== 'number' && typeof id !== 'bigint')
        throw new MasterNotFoundError('Facility id is invalid');
      return this.prisma.facility.update({ where: { id }, data });`,
            ],
            [
              `            availabilityStatus: text(input.availabilityStatus, 'AVAILABLE'),`,
              `            availabilityStatus: availabilityStatus(input.availabilityStatus),`,
            ],
          ]);

          replaceAll('src/modules/property/listing/infrastructure/listing.repository.ts', [
            [
              `        })
        .catch((error: unknown) => this.mapError(error)),
    );
  }

  async expireDue`,
              `        }),
    );
  }

  async expireDue`,
            ],
          ]);

          replaceAll('src/modules/property/presentation/property-master.controller.ts', [
            ['.updateCategory(uuid, d.version, d, actor(r, ua, rid))', '.updateCategory(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['.updateSubcategory(uuid, d.version, d, actor(r, ua, rid))', '.updateSubcategory(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['.createLocation(levelOf(level), d, actor(r, ua, rid))', '.createLocation(levelOf(level), { ...d }, actor(r, ua, rid))'],
            ['.updateLocation(levelOf(level), uuid, d.version, d, actor(r, ua, rid))', '.updateLocation(levelOf(level), uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['.updateFacility(uuid, d.version, d, actor(r, ua, rid))', '.updateFacility(uuid, d.version, { ...d }, actor(r, ua, rid))'],
            ['return this.service.createProperty(d, actor(r, ua, rid)).then(response);', 'return this.service.createProperty({ ...d }, actor(r, ua, rid)).then(response);'],
            ['.updateProperty(uuid, d.version, d, actor(r, ua, rid))', '.updateProperty(uuid, d.version, { ...d }, actor(r, ua, rid))'],
          ]);

          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const file = `${dir}/${entry.name}`;
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.py')) fs.rmSync(file);
            }
          };
          walk('.');
          NODE

          if find . -type f -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -print -quit | grep -q .; then
            echo 'Python files remain in repository' >&2
            exit 1
          fi

          npm ci
          npx prettier --write \
            src/modules/property/domain/property-extras.ts \
            src/modules/property/domain/repositories/property-master.repository.ts \
            src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts \
            src/modules/property/infrastructure/persistence/prisma-property-master.store.ts \
            src/modules/property/listing/domain/listing.types.ts \
            src/modules/property/listing/infrastructure/listing.repository.ts \
            src/modules/property/application/property-master.service.ts \
            src/modules/property/presentation/property-master.controller.ts

          npm run format:check
          npm run lint
          npm run typecheck

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/modules/property/domain/property-extras.ts \
            src/modules/property/domain/repositories/property-master.repository.ts \
            src/modules/property/infrastructure/persistence/prisma-property-details.repository.ts \
            src/modules/property/infrastructure/persistence/prisma-property-master.store.ts \
            src/modules/property/listing/domain/listing.types.ts \
            src/modules/property/listing/infrastructure/listing.repository.ts \
            src/modules/property/application/property-master.service.ts \
            src/modules/property/presentation/property-master.controller.ts

          while IFS= read -r -d '' file; do
            git rm -f -- "$file"
          done < <(find . -type f -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -print0)

          git rm -f -- .github/workflows/repair-property-types.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix: resolve property strict typing errors'
          git push origin HEAD:main
